    delete:
      tags:
        - Rencontres
      operationId: deleteEncounter
      x-phase: P3
      summary: 'Supprimer une rencontre (MJ).'
      description: 'Un joueur reçoit 404. Les pions déjà placés restent sur la carte.'
      responses:
        '204':
          description: 'Rencontre supprimée.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /encounters/{encounterId}/place:
    parameters:
      - $ref: '#/components/parameters/EncounterId'
    post:
      tags:
        - Rencontres
      operationId: placeEncounter
      x-phase: P3
      summary: 'Placer la rencontre sur une carte en un clic (MJ).'
      description: >-
        Crée tous les pions d'un coup, aux cases prévues, avec hidden repris de chaque créature et les PV
        selon hitPointMethod. mapId remplace celui de la rencontre s'il est fourni ; 400
        encounter_without_map si aucune carte n'est connue. 409 cell_occupied si une case prévue est prise.
        Un joueur reçoit 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceEncounterInput'
      responses:
        '201':
          description: 'Pions créés.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedEncounter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /campaigns/{campaignId}/scene:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags:
        - Cartes
      operationId: getScene
      security:
        - displayAuth: []
        - cookieAuth: []
        - bearerAuth: []
      summary: 'Lire la scène : carte active, brouillard, pions, initiative et round.'
      description: >-
        Point d'entrée de la vue joueurs, qui reçoit ensuite les changements par WebSocket, après
        projection. MJ : vue gm. Joueur ou jeton d'affichage : vue party, où une créature cachée est
        retirée de l'initiative (et non anonymisée), une créature déjà vue pendant ce combat y reste,
        avec son dernier état vu, et currentTurn vaut null pendant le tour d'une créature cachée (fuite
        assumée : le front affiche « Tour du MJ »).
      responses:
        '200':
          description: 'Vue de la scène selon le lecteur.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Cartes
      operationId: setActiveMap
      summary: 'Changer la carte affichée (MJ).'
      description: 'mapId null : aucune carte affichée. 404 si la carte est inconnue.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveMapInput'
      responses:
        '200':
          description: 'Scène mise à jour.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneGmView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns/{campaignId}/display-sessions:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags:
        - Cartes
      operationId: listDisplaySessions
      summary: "Lister les jetons d'affichage de la vue joueurs (MJ)."
      description: "Le jeton lui-même n'est jamais renvoyé ici : il n'est affiché qu'une fois, à sa création."
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 'Page de jetons.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplaySessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Cartes
      operationId: createDisplaySession
      summary: "Créer un jeton d'affichage pour la vue joueurs (MJ)."
      description: >-
        Le jeton, valable 12 heures, ne donne que la vue party, en lecture seule. Il est transmis à la
        fenêtre de la vue joueurs par le fragment d'URL (/vue-joueurs#<jeton>), que le front efface
        aussitôt avec history.replaceState pour ne garder le jeton qu'en mémoire.
      responses:
        '201':
          description: "Jeton créé. token n'est renvoyé qu'ici."
          headers:
            Cache-Control:
              description: 'Empêche le stockage de la réponse contenant le jeton.'
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplaySessionCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
