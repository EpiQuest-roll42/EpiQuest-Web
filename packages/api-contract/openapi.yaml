      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        level:
          type: integer
          minimum: 0
          maximum: 9
        school:
          $ref: '#/components/schemas/RuleId'
        concentration:
          type: boolean
        ritual:
          type: boolean
        classes:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'

    SpellSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpellSummary'
        nextCursor:
          type: string
          nullable: true

    ItemSummary:
      type: object
      required:
        - id
        - name
        - category
        - rarity
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        category:
          $ref: '#/components/schemas/ItemCategory'
        rarity:
          nullable: true
          description: 'Objets magiques seulement.'
          type: string
          allOf:
            - $ref: '#/components/schemas/Rarity'

    ItemSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        nextCursor:
          type: string
          nullable: true

    MonsterSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MonsterSummary'
        nextCursor:
          type: string
          nullable: true

    SrdAttribution:
      type: object
      description: >-
        Mention d'attribution affichée par la page de crédits du web et du mobile. text est la mention
        officielle de l'ADR 0005, en anglais, telle quelle ; changes liste les modifications apportées au
        SRD, exigées par la CC BY 4.0 (ADR 0009). Ces textes juridiques font exception à la règle « les
        libellés viennent de l'interface ».
      required:
        - text
        - sourceDocument
        - sourceUrl
        - license
        - licenseUrl
        - changes
        - language
        - rulesetVersion
        - importedAt
        - dataSource
      properties:
        text:
          type: string
          maxLength: 2000
        sourceDocument:
          type: string
          example: 'System Reference Document 5.1'
        sourceUrl:
          type: string
          format: uri
          example: 'https://dnd.wizards.com/resources/systems-reference-document'
        license:
          type: string
          enum:
            - CC-BY-4.0
        licenseUrl:
          type: string
          format: uri
          example: 'https://creativecommons.org/licenses/by/4.0/legalcode'
        changes:
          type: array
          items:
            type: string
            maxLength: 500
          example:
            - 'Modifié : converti en format structuré, unités converties au système métrique.'
        language:
          type: string
          description: 'Langue des noms et descriptions SRD (BCP 47).'
          example: 'en'
        rulesetVersion:
          type: string
          example: 'srd-5.1-2026.10'
        importedAt:
          type: string
          format: date-time
        dataSource:
          type: object
          description: 'Source des données structurées, sous licence MIT ; texte complet dans THIRD_PARTY_NOTICES.md.'
          required:
            - name
            - url
            - license
            - copyright
          properties:
            name:
              type: string
              example: '5e-bits, 5e-srd-api'
            url:
              type: string
              format: uri
              example: 'https://github.com/5e-bits/5e-srd-api'
              description: 'Le dépôt GitHub, où se trouve la licence MIT citée.'
            license:
              type: string
              enum:
                - MIT
            copyright:
              type: string
              example: 'Copyright (c) 2018-2020 Adrian Padua, Christopher Ward'

    SpeciesSummary:
      type: object
      description: "Résumé affiché sur les cartes de l'étape Espèce de l'assistant."
      required:
        - id
        - name
        - family
        - size
        - speedMeters
        - abilityBonuses
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        family:
          $ref: '#/components/schemas/RuleId'
        size:
          $ref: '#/components/schemas/Size'
        speedMeters:
          type: number
          minimum: 0
        abilityBonuses:
          type: array
          items:
            type: object
            required:
              - ability
              - value
            properties:
              ability:
                $ref: '#/components/schemas/AbilityCode'
              value:
                type: integer

    SpeciesSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpeciesSummary'
        nextCursor:
          type: string
          nullable: true

    ClassSummary:
      type: object
      description: "Résumé affiché sur les cartes de l'étape Classe de l'assistant (« DV d10 · FOR ou DEX · toutes les armures »)."
      required:
        - id
        - name
        - hitDie
        - primaryAbilities
        - armorCategories
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        hitDie:
          type: string
          pattern: '^d(6|8|10|12)$'
        primaryAbilities:
          type: array
          items:
            $ref: '#/components/schemas/AbilityCode'
        armorCategories:
          type: array
          description: "Catégories d'armure maîtrisées."
          items:
            type: string
            enum:
              - light
              - medium
              - heavy
              - shield

    ClassSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassSummary'
        nextCursor:
          type: string
          nullable: true

    # --- CAMPAGNES : SÉANCES ---
    Session:
      type: object
      required:
        - id
        - number
        - startedAt
        - endedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        number:
          type: integer
          minimum: 1
          description: 'Numéro de la séance dans la campagne (« Séance 3 »).'
          example: 3
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: 'null tant que la séance est ouverte.'

    SessionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          type: string
          nullable: true

    # --- CARTES : GABARITS DE ZONE ---
    AreaSpec:
      type: object
      description: >-
        Forme d'une zone d'effet, reprise de Targeting.zone (section Données SRD). Une case est touchée si
        son centre est dans la forme : règle calculée par le moteur de règles, identique dans le navigateur
        et sur le serveur (docs/technique/format-des-regles.md).
      required:
        - shape
        - sizeMeters
        - origin
      properties:
        shape:
          type: string
          enum:
            - sphere
            - cone
            - line
            - cube
            - cylinder
        sizeMeters:
          type: number
          minimum: 0
          description: 'Rayon (sphère, cylindre), longueur (cône, ligne) ou côté (cube).'
        widthMeters:
          type: number
          minimum: 0
          description: 'Largeur de la ligne.'
        origin:
          type: object
          description: "Point d'origine, en cases ; les décimales sont permises (0,5 = milieu d'une case)."
          required:
            - x
            - y
          properties:
            x:
              type: number
              minimum: 0
              maximum: 100
            y:
              type: number
              minimum: 0
              maximum: 100
        directionDegrees:
          type: number
          minimum: 0
          exclusiveMaximum: true
          maximum: 360
          description: 'Cône et ligne : direction en degrés, 0 = nord, sens horaire.'

    TemplateLabel:
      type: string
      maxLength: 60
      example: 'Nuage de brouillard'

    MapTemplateGm:
      type: object
      required:
        - id
        - area
        - label
        - public
        - affectedCells
      properties:
        id:
          $ref: '#/components/schemas/Id'
        area:
          $ref: '#/components/schemas/AreaSpec'
        label:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TemplateLabel'
        public:
          type: boolean
          description: 'Envoyé aux joueurs.'
        affectedCells:
          readOnly: true
          description: 'Cases touchées, calculées par le serveur.'
          allOf:
            - $ref: '#/components/schemas/CellSet'

    MapTemplateParty:
      type: object
      description: 'Gabarit public vu par les joueurs, sans identifiant.'
      required:
        - area
        - label
      properties:
        area:
          $ref: '#/components/schemas/AreaSpec'
        label:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TemplateLabel'

    CreateMapTemplateInput:
      type: object
      required:
        - area
        - public
      additionalProperties: false
      x-phase: P3
      properties:
        area:
          $ref: '#/components/schemas/AreaSpec'
        label:
          $ref: '#/components/schemas/TemplateLabel'
        public:
          type: boolean

    UpdateMapTemplateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      x-phase: P3
      properties:
        area:
          $ref: '#/components/schemas/AreaSpec'
        label:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TemplateLabel'
        public:
          type: boolean

    # --- RENCONTRES ---
    DifficultyRating:
      type: string
      enum:
        - trivial
        - easy
        - medium
        - hard
        - deadly
      description: 'Les quatre niveaux de la fiche (facile, moyenne, difficile, mortelle), plus trivial sous le seuil easy.'

    EncounterDifficulty:
      type: object
      readOnly: true
      description: >-
        Difficulté calculée par le moteur de règles. La source des seuils (SRD 5.1, SRD 5.2 ou règle propre
        à Lanterne) est à vérifier avant P3-05 et à décider dans une ADR ; le format ne dépend pas de la
        source, grâce au tableau thresholds.
      required:
        - rating
        - totalXp
        - adjustedXp
        - thresholds
        - partySize
      properties:
        rating:
          $ref: '#/components/schemas/DifficultyRating'
        totalXp:
          type: integer
          minimum: 0
        adjustedXp:
          type: integer
          minimum: 0
          description: 'XP ajusté selon le nombre de créatures.'
        thresholds:
          type: array
          items:
            type: object
            required:
              - rating
              - xp
            properties:
              rating:
                $ref: '#/components/schemas/DifficultyRating'
              xp:
                type: integer
                minimum: 0
        partySize:
          type: integer
          minimum: 0

    EncounterCreature:
      type: object
      required:
        - monster
        - count
        - displayName
        - hidden
        - cells
      properties:
        monster:
          $ref: '#/components/schemas/RuleRef'
        count:
          type: integer
          minimum: 1
          maximum: 20
        displayName:
          type: string
          nullable: true
          description: 'Nom affiché aux joueurs ; le nom du monstre si null.'
          allOf:
            - $ref: '#/components/schemas/DisplayName'
        hidden:
          type: boolean
        cells:
          type: array
          nullable: true
          description: 'Cases prévues sur la carte, autant que count ; null si le MJ place les pions à la main.'
          items:
            $ref: '#/components/schemas/Cell'

    Encounter:
      type: object
      description: 'Préparation du MJ, jamais envoyée aux joueurs.'
      required:
        - id
        - name
        - mapId
        - creatures
        - partyLevels
        - difficulty
        - placedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/EncounterName'
        mapId:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Id'
        creatures:
          type: array
          items:
            $ref: '#/components/schemas/EncounterCreature'
        partyLevels:
          type: array
          nullable: true
          description: 'Niveaux du groupe pour le calcul ; null = les personnages actifs de la campagne.'
          items:
            type: integer
            minimum: 1
            maximum: 20
        difficulty:
          $ref: '#/components/schemas/EncounterDifficulty'
        placedAt:
          type: string
          format: date-time
          nullable: true

    EncounterName:
      type: string
      minLength: 1
      maxLength: 60
      example: "Embuscade à l'entrée de la crypte"

    EncounterPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Encounter'
        nextCursor:
          type: string
          nullable: true

    EncounterCreatureInput:
      type: object
      required:
        - monsterId
        - count
      additionalProperties: false
      properties:
        monsterId:
          $ref: '#/components/schemas/RuleId'
        count:
          type: integer
          minimum: 1
          maximum: 20
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hidden:
          type: boolean
          default: false
        cells:
          type: array
          nullable: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/Cell'

    CreateEncounterInput:
      type: object
      required:
        - name
        - creatures
      additionalProperties: false
      x-phase: P3
      properties:
        name:
          $ref: '#/components/schemas/EncounterName'
        mapId:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Id'
        creatures:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/EncounterCreatureInput'
        partyLevels:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: integer
            minimum: 1
            maximum: 20

    UpdateEncounterInput:
      type: object
      minProperties: 1
      additionalProperties: false
      x-phase: P3
      properties:
        name:
          $ref: '#/components/schemas/EncounterName'
        mapId:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Id'
        creatures:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/EncounterCreatureInput'
        partyLevels:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: integer
            minimum: 1
            maximum: 20

    PlaceEncounterInput:
      type: object
      additionalProperties: false
      x-phase: P3
      properties:
        mapId:
          $ref: '#/components/schemas/Id'
        hitPointMethod:
          type: string
          enum:
            - average
            - roll
          default: average

    PlacedEncounter:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenGm'
