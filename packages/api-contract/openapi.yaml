        Le MJ reçoit tous les jets ; un joueur reçoit les jets publics et ses propres jets privés ; la vue
        joueurs (jeton d'affichage) ne reçoit que les jets publics. Le
        filtrage selon le lecteur est fait dans la requête en base, pas après coup : une page ne doit
        jamais compter moins d'éléments que limit à cause d'un jet masqué. Aucun numéro séquentiel
        n'est renvoyé, et le curseur est opaque.
      parameters:
