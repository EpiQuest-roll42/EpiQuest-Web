      description: 'Réservé au MJ : un joueur reçoit 403, il ne voit que la carte active, par getScene.'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 'Page de cartes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Cartes
      operationId: createMap
      summary: 'Créer une carte (MJ).'
      description: 'La grille ne change plus après la création, pour ne pas déplacer les pions et les murs déjà posés. revealAll est faux par défaut.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMapInput'
      responses:
        '201':
          description: 'Carte créée.'
          headers:
            ETag:
              $ref: '#/components/headers/GeometryETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapGmView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /maps/{mapId}:
    parameters:
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Cartes
      operationId: getMap
      security:
        - displayAuth: []
        - cookieAuth: []
        - bearerAuth: []
      summary: 'Lire une carte.'
      description: >-
        Le MJ reçoit la vue gm, avec un en-tête ETag égal à geometryVersion. Un joueur, ou la vue
        joueurs avec son jeton d'affichage, reçoit la vue party, et seulement pour la carte active : 404
        pour toute autre carte, dont il ne doit pas connaître l'existence.
      responses:
        '200':
          description: 'Vue de la carte selon le lecteur.'
          headers:
            ETag:
              $ref: '#/components/headers/GeometryETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Cartes
      operationId: updateMap
      summary: 'Renommer la carte ou changer autoReveal et revealAll (MJ).'
      description: "Joueur : 403 si c'est la carte active, sinon 404."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMapInput'
      responses:
        '200':
          description: 'Carte modifiée.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapGmView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Cartes
      operationId: deleteMap
      x-phase: P3
      summary: 'Supprimer une carte (MJ).'
      description: "409 map_active si c'est la carte active. Joueur : 403 si c'est la carte active, sinon 404."
      responses:
        '204':
          description: 'Carte supprimée.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /maps/{mapId}/background:
    parameters:
      - $ref: '#/components/parameters/MapId'
    put:
      tags:
        - Cartes
      operationId: uploadMapBackground
      summary: 'Envoyer le fond de carte (MJ).'
      description: >-
        PNG, JPEG ou WebP, reconnu par ses premiers octets et non par son extension (415 sinon). 10 Mo
        et 8 192 × 8 192 pixels au plus, vérifiés avant de décoder l'image (413 sinon), pour éviter les
        bombes de décompression. Le serveur réencode l'image en WebP, ce qui supprime les métadonnées
        EXIF, et la redimensionne pour qu'une case fasse 64 pixels. Joueur : 403 si c'est la carte
        active, sinon 404.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 'Fond enregistré.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapGmView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /maps/{mapId}/tiles/{x}/{y}:
    parameters:
      - $ref: '#/components/parameters/MapId'
      - name: x
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 12
      - name: y
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 12
    get:
      tags:
        - Cartes
      operationId: getMapTile
      security:
        - displayAuth: []
        - cookieAuth: []
        - bearerAuth: []
      summary: 'Lire une tuile du fond de carte (8 × 8 cases, 512 × 512 pixels).'
      description: >-
        MJ : tuile complète, sans paramètre mask, avec Cache-Control no-store, pour qu'une tuile
        complète ne soit jamais en cache dans le navigateur que partagent la fenêtre du MJ et la vue
        joueurs. Vue party : le paramètre mask est obligatoire ; le serveur calcule l'empreinte du
        masque actuel de la tuile et répond 404 si elle diffère de celle de l'URL. Il ne calcule jamais
        une tuile à partir d'un masque fourni par le client. Les cases cachées sont masquées côté serveur
        avant l'envoi, et une tuile entièrement cachée renvoie 404. Le contenu étant entièrement
        déterminé par l'URL, la réponse est cachée avec immutable. La vue joueurs charge les tuiles avec
        fetch et son jeton, jamais avec une balise img, qui enverrait le cookie du MJ.
      parameters:
        - name: mask
          in: query
          required: false
          description: 'Empreinte du masque de la tuile, fournie par MapPartyView.background.tiles. Obligatoire pour la vue party.'
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 'La tuile en WebP.'
          headers:
            Cache-Control:
              description: 'no-store pour la tuile complète du MJ ; private, max-age=31536000, immutable pour une tuile masquée.'
              schema:
                type: string
            Vary:
              description: 'Tuiles masquées de la vue joueurs : X-Display-Token, Authorization, Cookie, pour que le cache distingue chaque lecteur. Inutile sur les tuiles du MJ, qui sont en no-store.'
              schema:
                type: string
                enum:
                  - X-Display-Token, Authorization, Cookie
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /maps/{mapId}/geometry:
    parameters:
      - $ref: '#/components/parameters/MapId'
    put:
      tags:
        - Cartes
      operationId: replaceMapGeometry
      x-phase: P3
      summary: "Enregistrer d'un bloc les murs, portes, zones et décor (MJ)."
      description: >-
        Un élément avec id est conservé, un élément sans id est créé, un élément absent est supprimé.
        If-Match doit contenir l'ETag lu par getMap : 412 si la version a changé (un autre onglet a
        modifié la carte), 428 si If-Match est absent. Murs et portes seulement sur une grille carrée :
        400 walls_require_square_grid sur une grille hexagonale. Joueur : 403 si c'est la carte active,
        sinon 404.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: 'ETag de la géométrie lue, par exemple "12". Son absence donne 428.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapGeometryInput'
      responses:
        '200':
          description: 'Géométrie enregistrée.'
          headers:
            ETag:
              $ref: '#/components/headers/GeometryETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapGmView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /maps/{mapId}/doors/{doorId}:
    parameters:
