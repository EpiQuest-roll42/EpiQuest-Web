  /rolls:
    post:
      tags:
        - Dés
      operationId: rollDice
      summary: 'Lancer des dés.'
      description: >-
        Le serveur analyse et lance l'expression (notation : docs/technique/notation-des-des.md). Sans
        campaignId, c'est un jet personnel, toujours private et non enregistré : id vaut null, et
        visibility public ou hidden renvoie 400 visibility_requires_campaign. characterId est alors
        accepté pour ses propres personnages uniquement, brouillons compris. Avec campaignId, un
        non-membre reçoit 404 ; un joueur choisit public ou private (403 hidden_roll_gm_only pour hidden)
        et n'indique que son propre personnage rattaché à la campagne ; le MJ choisit public ou hidden
        (400 private_roll_player_only pour private) et peut indiquer n'importe quel personnage de sa
        campagne. Un characterId non autorisé renvoie 404. Diffusion WebSocket de roll.created : public
        sur les deux canaux, private sur le canal MJ et vers le lanceur, hidden sur le canal MJ seulement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollInput'
      responses:
        '201':
          description: 'Jet lancé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollResult'
        '400':
          $ref: '#/components/responses/DiceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /rolls/{rollId}:
    parameters:
      - name: rollId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags:
        - Dés
      operationId: getRoll
      security:
        - displayAuth: []
        - cookieAuth: []
        - bearerAuth: []
      summary: 'Lire un jet.'
      description: >-
        404 si le jet n'est pas visible du lecteur, y compris pour un membre de la campagne : un 403
        confirmerait l'existence d'un jet privé ou caché, ce qui est déjà une information cachée.
        C'est la seule exception à la règle « membre sans le droit → 403 ».
      responses:
        '200':
          description: 'Le jet.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns/{campaignId}/rolls:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags:
        - Dés
      operationId: listCampaignRolls
      security:
        - displayAuth: []
        - cookieAuth: []
        - bearerAuth: []
      summary: "Lister les jets d'une campagne, du plus récent au plus ancien."
      description: >-
        Le MJ reçoit tous les jets ; un joueur reçoit les jets publics et ses propres jets privés ; la vue
        joueurs (jeton d'affichage) ne reçoit que les jets publics. Le
        filtrage selon le lecteur est fait dans la requête en base, pas après coup : une page ne doit
        jamais compter moins d'éléments que limit à cause d'un jet masqué. Aucun numéro séquentiel
        n'est renvoyé, et le curseur est opaque.
      parameters:
        - name: characterId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 'Page de jets.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollResultPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dice/probabilities:
    post:
      tags:
        - Dés
      operationId: getDiceProbabilities
      summary: "Calculer la distribution exacte d'une expression, sans lancer les dés."
      description: >-
        Sert aussi à valider l'expression pendant la saisie, avec les mêmes erreurs de notation que
        rollDice. Le web calcule localement avec le moteur de règles (ADR 0007) : la route sert surtout
        au mobile, qui attend 300 ms sans frappe avant de l'appeler. 400 too_complex_for_probabilities
        si l'expression a plus de 2 000 totaux possibles (connu dès l'analyse, avant tout calcul) ou
        plus de 20 dés dans des termes avec kh, kl, ! ou r.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbabilityInput'
      responses:
        '200':
          description: 'Distribution des totaux.'
