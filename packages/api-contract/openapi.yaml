components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Jeton d'accès, utilisé par l'application mobile."
    cookieAuth:
      type: apiKey
      in: cookie
      name: lanterne_session
      description: "Cookie de session `httpOnly`, utilisé par l'application web."
    displayAuth:
      type: apiKey
      in: header
      name: X-Display-Token
      description: >-
        Jeton d'affichage de la vue joueurs (createDisplaySession) : vue party seulement, en lecture
        seule, valable 12 heures, révocable par le MJ. Déclaré uniquement sur getScene, getMap,
        getMapTile, listCampaignRolls et getRoll ; sur toute autre route, un jeton d'affichage reconnu
        reçoit 403 display_token_not_allowed (le jeton est valide mais n'a pas ce droit). Si ce jeton
        est présent, il s'applique seul : le cookie de session du MJ, que le navigateur joint aussi aux
        requêtes de la vue joueurs, est ignoré. La vue joueurs fait ses requêtes avec credentials omit,
        et son WebSocket s'authentifie par un premier message contenant le jeton, jamais par l'URL.
        Depuis le sous-domaine de la vue joueurs, cet en-tête déclenche une requête CORS préalable : l'API
        doit l'autoriser dans Access-Control-Allow-Headers.

  headers:
    SrdETag:
      description: 'Version des données : <importVersion>-<id> pour un élément, <importVersion>-<empreinte des filtres et du curseur> pour une liste.'
      schema:
        type: string
    SrdCacheControl:
      description: "Les données ne changent qu'à un nouvel import."
      schema:
        type: string
        enum:
          - private, max-age=3600
    SrdLicenseLink:
      description: 'Lien vers la mention d''attribution : </api/v1/srd/attribution>; rel="license".'
      schema:
        type: string
    GeometryETag:
      description: 'Version de la géométrie de la carte (geometryVersion), à renvoyer dans If-Match.'
      schema:
        type: string
        example: '"12"'

  responses:
    NotModified:
      description: "Rien n'a changé depuis l'ETag indiqué dans If-None-Match : le client garde sa copie."
      headers:
        ETag:
          $ref: '#/components/headers/SrdETag'
    BadRequest:
      description: 'Requête invalide ou données de validation incorrectes.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            passwordTooShort:
              summary: 'Le mot de passe ne respecte pas la longueur minimale.'
              value:
                type: '/problems/validation-error'
                title: Bad Request
                status: 400
                detail: 'One or more validation errors occurred.'
                errors:
                  - field: password
                    code: too_short
    Conflict:
      description: "Conflit de données, par exemple un nom d'utilisateur ou une adresse e-mail déjà pris."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            emailAlreadyTaken:
              summary: "L'adresse e-mail est déjà associée à un compte."
              value:
                type: '/problems/conflict'
                title: Conflict
                status: 409
                detail: 'An account with this email already exists.'
                errors:
                  - field: email
                    code: already_taken
    TooManyRequests:
      description: 'Trop de requêtes. Réessayez après le délai indiqué par `Retry-After`.'
      headers:
        Retry-After:
          description: 'Délai avant une nouvelle tentative, en secondes ou sous forme de date HTTP.'
          schema:
            type: string
          example: '60'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'Authentification invalide ou expirée.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCredentials:
              summary: 'Les identifiants sont invalides.'
              value:
                type: '/problems/unauthorized'
                title: Unauthorized
                status: 401
                detail: 'The email or password is incorrect.'
    NotFound:
      description: "Ressource introuvable, ou ressource d'une campagne dont l'utilisateur n'est pas membre."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              summary: "La ressource demandée n'existe pas."
              value:
                type: '/problems/not-found'
                title: Not Found
                status: 404
    Forbidden:
      description: 'Membre de la campagne, mais sans le rôle requis (par exemple un joueur sur une route réservée au MJ).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gmOnly:
              summary: 'Route réservée au MJ.'
              value:
                type: '/problems/forbidden'
                title: Forbidden
                status: 403

    DiceBadRequest:
      description: >-
        Expression de dés invalide ou requête incorrecte. Les erreurs de notation (field = expression)
        portent la position et la longueur du passage fautif, en unités UTF-16 de la chaîne envoyée.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            keepOutOfRange:
              summary: 'kh7 sur 4 dés.'
              value:
                type: '/problems/validation-error'
                title: Bad Request
                status: 400
                errors:
                  - field: expression
                    code: keep_out_of_range
                    position: 3
                    length: 3
                    params:
                      min: 1
                      max: 4
    PayloadTooLarge:
      description: 'Fichier trop lourd (plus de 10 Mo) ou image trop grande (plus de 8 192 × 8 192 pixels).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 'Format refusé : seuls PNG, JPEG et WebP sont acceptés, reconnus par leurs premiers octets.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "La version indiquée dans If-Match n'est plus la version actuelle : relire la carte avant d'enregistrer."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: "If-Match est obligatoire sur cette route, pour ne pas écraser la modification d'un autre onglet."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MapId:
      name: mapId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SessionIdFilter:
      name: sessionId
      in: query
      required: false
      description: 'Ne garder que les éléments de cette séance. Exclusif avec session (400 si les deux sont fournis).'
      schema:
        $ref: '#/components/schemas/Id'
    SessionFilter:
      name: session
      in: query
      required: false
      description: "current : ne garder que les éléments de la séance ouverte (aucun résultat s'il n'y en a pas)."
      schema:
        type: string
        enum:
          - current
    SrdId:
      name: ruleId
      in: path
      required: true
      description: 'Identifiant SRD, unique pour un type donné : le chemin indique le type.'
      schema:
        $ref: '#/components/schemas/RuleId'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: "ETag de la copie du client ; réponse 304 si rien n'a changé."
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Curseur opaque renvoyé dans nextCursor par la page précédente.'
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      required: false
      description: "Nombre maximal d'éléments par page."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Id:
      type: string
      format: uuid
      description: 'Identifiant unique formaté en UUID v4 standard.'
      example: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'

    Username:
      type: string
      minLength: 3
      maxLength: 20
      pattern: '^[a-zA-Z0-9_]+$'
      description: >-
        Nom d'affichage unique de l'utilisateur. Limité strictement aux caractères alphanumériques 
        et aux underscores pour éviter les attaques par homographe (ex: mélange de caractères cyrilliques 
        et latins). La vérification de l'unicité doit être insensible à la casse.
      example: 'RolePlayMaster'

    Email:
      type: string
      format: email
      maxLength: 254
      description: 'Adresse e-mail valide.'
      example: 'joueur.un@example.org'

    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: >-
        Mot de passe sécurisé pour la création ou le renouvellement. La longueur maximale est 
        strictement plafonnée pour éviter les attaques par déni de service (DoS) ciblant les algorithmes de hachage.
      example: 'SuperSecurePassword123!'

    PasswordCheck:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Validation d'un mot de passe existant pour authentification ou ré-authentification. 
        Contrainte volontairement souple (minLength: 1) pour ne pas bloquer les utilisateurs en cas de 
        changement de politique de sécurité globale et pour ne pas divulguer les règles de complexité.
      example: 'SuperSecurePassword123!'

    FieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: 'Le chemin JSON de la propriété de la requête ayant échoué à la validation.'
          example: 'newPassword'
        code:
          type: string
          description: >-
            Code d'erreur lisible par une machine en anglais (ex: 'too_short', 'already_taken', 'password_required'). 
            Les clients utilisent ce code pour générer les libellés traduits dans l'interface utilisateur.
          example: 'too_short'
        position:
          type: integer
          minimum: 0
          description: >-
            Erreur de notation de dés seulement : index du premier caractère fautif dans la chaîne telle
            qu'envoyée, en unités UTF-16, espaces compris.
        length:
          type: integer
          minimum: 0
          description: 'Erreur de notation de dés seulement : nombre de caractères à souligner ; 0 pour une fin inattendue.'
        params:
          type: object
          additionalProperties: true
          description: "Valeurs utiles au message construit par l'interface, par exemple { min: 1, max: 4 }."

    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: 'Chemin relatif ou absolu identifiant le type de problème.'
          example: '/problems/validation-error'
        title:
          type: string
          description: 'Un résumé court et lisible en anglais destiné aux développeurs décrivant le type de problème.'
          example: 'Bad Request'
        status:
          type: integer
          description: "Le code de statut HTTP généré par le serveur d'origine."
          example: 400
        detail:
          type: string
          description: 'Une explication détaillée en anglais axée sur le développeur concernant cette occurrence spécifique.'
          example: 'One or more validation errors occurred.'
        instance:
          type: string
          format: uri-reference
          description: "Une référence d'URI identifiant l'occurrence spécifique du problème."
          example: '/users/me/password'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: >-
            Liste optionnelle d'erreurs de validation spécifiques aux champs pour les formulaires. Une erreur
            sur une expression de dés (field = expression) remplit aussi position, length et params.

    UserPublic:
      type: object
      required:
        - id
        - username
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          $ref: '#/components/schemas/Username'

    CurrentUser:
      type: object
      required:
        - id
        - username
        - email
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
        createdAt:
          type: string
          format: date-time
          description: 'Horodatage de la création du profil utilisateur.'
          example: '2026-11-02T18:15:00Z'

    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: 'Chaîne opaque de sécurité représentant la session active. Les clients mobiles ne doivent jamais la décoder.'
          example: 'at_7d4bad9bdd2b0d7b3dcb6d9b1deb4d3b7d4b'
        tokenType:
          type: string
          enum:
            - Bearer
          description: "Le type de jeton d'accès émis."
          example: 'Bearer'
        expiresIn:
          type: integer
          description: "La durée de vie restante du jeton d'accès exprimée en secondes."
          example: 3600

    RegisterInput:
      type: object
      required:
        - email
        - username
        - password
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'

    LoginInput:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      description: "Identifiants utilisés pour s'authentifier sur l'application."
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/PasswordCheck'

    UpdateUserInput:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >-
        Données pour mettre à jour partiellement le profil actif. Modifier l'adresse e-mail exige de 
        remplir le champ currentPassword, retournant un code d'erreur 400 'password_required' s'il est manquant.
      properties:
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
        currentPassword:
          $ref: '#/components/schemas/PasswordCheck'

    ChangePasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
      description: "Modifie le mot de passe actuel. Provoque l'invalidation de toutes les autres sessions actives du compte."
      properties:
        currentPassword:
          $ref: '#/components/schemas/PasswordCheck'
        newPassword:
          $ref: '#/components/schemas/Password'

    ForgotInput:
      type: object
      required:
        - email
      additionalProperties: false
      description: "Données requises pour initier une procédure d'oubli de mot de passe via e-mail."
      properties:
        email:
          $ref: '#/components/schemas/Email'

    ResetInput:
      type: object
      required:
        - token
        - newPassword
      additionalProperties: false
      description: 'Valide le jeton de réinitialisation et applique le nouveau mot de passe. Révoque toutes les sessions et cookies existants.'
      properties:
        token:
          type: string
          maxLength: 128
          description: "Jeton de réinitialisation sécurisé envoyé via l'infrastructure d'e-mailing."
          example: 'rst_8fbc2c149bd40153'
        newPassword:
          $ref: '#/components/schemas/Password'

    DeleteAccountInput:
      type: object
      required:
        - currentPassword
      additionalProperties: false
      x-phase: P3
      description: >-
        Données destinées à la route non-idempotente de suppression POST /users/me/deletion. 
        Protège contre le vol et le détournement de session active en imposant une ré-authentification par mot de passe.
      properties:
        currentPassword:
          $ref: '#/components/schemas/PasswordCheck'

    # --- CAMPAGNES ---
    InvitationCode:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$'
      description: >-
        Code d'invitation tel que le serveur le renvoie : 10 caractères aléatoires de l'alphabet Crockford
        base32 (sans I, L, O ni U), soit 50 bits d'entropie, au format XXXXX-XXXXX, en majuscules.
      example: '7KQ2M-9XMAT'

    InvitationCodeInput:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{5}-[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{5}$'
      description: >-
        Code d'invitation saisi par l'utilisateur. La casse est ignorée : le serveur met le code en
        majuscules avant de le comparer.
      example: '7kq2m-9xmat'

    CampaignRole:
      type: string
      enum:
        - gm
        - player
      description: 'Rôle dans une campagne : MJ (gm) ou joueur (player).'
      example: player

    CampaignName:
      type: string
      minLength: 3
      maxLength: 60
      description: 'Nom de la campagne. Le serveur retire les espaces de début et de fin avant de valider la longueur.'
      example: 'La Mine perdue'

    CampaignDescription:
      type: string
      maxLength: 2000
      description: 'Description libre de la campagne.'
      example: 'Une campagne pour joueurs débutants, du niveau 1 au niveau 5.'

    CharacterRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CharacterName'

    Invitation:
      type: object
      required:
        - code
        - url
        - createdAt
      properties:
        code:
          $ref: '#/components/schemas/InvitationCode'
        url:
          type: string
          format: uri
          description: "Lien d'invitation. Le code est dans le fragment (#), que le navigateur n'envoie jamais au serveur."
          example: 'https://app.example.org/rejoindre#7KQ2M-9XMAT'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-02T18:15:00Z'

    InvitationPreview:
      type: object
      required:
        - campaignName
        - gm
        - playerCount
      properties:
        campaignName:
          $ref: '#/components/schemas/CampaignName'
        gm:
          $ref: '#/components/schemas/UserPublic'
        playerCount:
          type: integer
          minimum: 0
          example: 3

    CampaignSummary:
      type: object
      required:
        - id
        - name
        - myRole
        - gm
        - playerCount
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CampaignName'
        myRole:
          $ref: '#/components/schemas/CampaignRole'
        gm:
          $ref: '#/components/schemas/UserPublic'
        playerCount:
          type: integer
          minimum: 0
          example: 3
        myCharacter:
          description: "Personnage de l'utilisateur, seulement s'il est joueur ; null s'il n'en a pas encore choisi."
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CharacterBrief'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-02T18:15:00Z'

    CampaignGmView:
      type: object
      description: 'Vue MJ de la campagne. Les données réservées au MJ (notes, PNJ, documents) seront ajoutées ici uniquement.'
      required:
        - viewerRole
        - id
        - name
        - gm
        - playerCount
        - invitation
        - createdAt
      properties:
        viewerRole:
          type: string
          enum:
            - gm
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CampaignName'
        description:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CampaignDescription'
        gm:
          $ref: '#/components/schemas/UserPublic'
        playerCount:
          type: integer
          minimum: 0
          example: 3
        invitation:
          $ref: '#/components/schemas/Invitation'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-02T18:15:00Z'

    CampaignPlayerView:
      type: object
      description: "Vue joueur de la campagne. Ne contient aucune donnée réservée au MJ, pas même le code d'invitation."
      required:
        - viewerRole
        - id
        - name
        - gm
        - playerCount
        - createdAt
      properties:
        viewerRole:
          type: string
          enum:
            - player
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CampaignName'
        description:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CampaignDescription'
        gm:
          $ref: '#/components/schemas/UserPublic'
        playerCount:
          type: integer
          minimum: 0
          example: 3
        myCharacter:
          description: "Personnage du joueur ; null s'il n'en a pas encore choisi."
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CharacterBrief'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-02T18:15:00Z'

    CampaignView:
      description: 'Vue de la campagne selon le rôle de la personne qui la consulte (projection par spectateur).'
      oneOf:
        - $ref: '#/components/schemas/CampaignGmView'
        - $ref: '#/components/schemas/CampaignPlayerView'
      discriminator:
        propertyName: viewerRole
        mapping:
          gm: '#/components/schemas/CampaignGmView'
          player: '#/components/schemas/CampaignPlayerView'

    Member:
      type: object
      required:
        - user
        - role
        - joinedAt
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
        role:
          $ref: '#/components/schemas/CampaignRole'
        character:
          description: "Personnage du membre ; null pour le MJ ou pour un joueur qui n'en a pas encore choisi."
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CharacterBrief'
        joinedAt:
          type: string
          format: date-time
          example: '2026-11-02T18:15:00Z'

    CampaignSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CampaignSummary'
        nextCursor:
          type: string
          nullable: true
          description: 'Curseur de la page suivante ; null sur la dernière page.'

    MemberPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: string
          nullable: true
          description: 'Curseur de la page suivante ; null sur la dernière page.'

    CreateCampaignInput:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/CampaignName'
        description:
          $ref: '#/components/schemas/CampaignDescription'

    UpdateCampaignInput:
      type: object
      minProperties: 1
      additionalProperties: false
      x-phase: P3
      properties:
        name:
          $ref: '#/components/schemas/CampaignName'
        description:
          $ref: '#/components/schemas/CampaignDescription'

    LookupInvitationInput:
      type: object
      required:
        - code
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/InvitationCodeInput'

    JoinCampaignInput:
      type: object
      required:
        - code
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/InvitationCodeInput'
        characterId:
          $ref: '#/components/schemas/Id'

    SetCharacterInput:
      type: object
      required:
        - characterId
      additionalProperties: false
      properties:
        characterId:
          $ref: '#/components/schemas/Id'

    TransferGameMasterInput:
      type: object
      required:
        - userId
      additionalProperties: false
      x-phase: P3
      properties:
        userId:
          $ref: '#/components/schemas/Id'

    # --- PERSONNAGES : PETITS TYPES ---
    RuleId:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64
      description: >-
        Identifiant d'une donnée SRD (espèce, classe, historique, sort, objet, état…), repris des index
        de la source importée (5e-bits) à l'import. Unique pour un type donné : le type est porté par le champ.
      example: 'fighter'

    RuleRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          description: >-
            Nom de la donnée SRD, traduit à l'import. C'est du contenu de règles, pas un libellé
            d'interface : il fait exception à la règle « les libellés viennent de l'interface ».
          example: 'Guerrier'

    AbilityCode:
      type: string
      enum:
        - str
        - dex
        - con
        - int
        - wis
        - cha
      description: 'Code de caractéristique.'
      example: dex

    CharacterName:
      type: string
      minLength: 1
      maxLength: 60
      example: 'Mira'

    CharacterStatus:
      type: string
      enum:
        - draft
        - active
      description: 'Brouillon (création en cours) ou personnage actif.'
      example: active

    CreationStep:
      type: string
      enum:
        - species
        - class
        - background
        - abilities
        - proficiencies
        - equipment
        - spells
      description: >-
        Étape de création, dans l'ordre d'affichage. proficiencies couvre compétences, outils et langues.
        Pour une classe sans sorts, l'étape spells renvoie groups vide et le client la saute. Le
        récapitulatif final n'existe que côté client : il appelle finalizeCreation.
      example: abilities

    ValueBreakdown:
      type: object
      readOnly: true
      description: >-
        Valeur calculée par le serveur et son détail. Le client affiche lui-même les libellés à partir
        de source (par exemple « Cuir 11 + DEX 3 »).
      required:
        - value
        - parts
      properties:
        value:
          type: integer
          example: 14
        parts:
          type: array
          items:
            type: object
            required:
              - source
              - value
            properties:
              source:
                type: object
                required:
                  - kind
                  - ref
                properties:
                  kind:
                    type: string
                    enum:
                      - base
                      - ability
                      - item
                      - feature
                      - proficiency
                      - species
                  ref:
                    description: 'RuleId de la source, ou code de caractéristique (par exemple dex).'
                    allOf:
                      - $ref: '#/components/schemas/RuleId'
              value:
                type: integer
          example:
            - source:
                kind: item
                ref: leather-armor
              value: 11
            - source:
                kind: ability
                ref: dex
              value: 3

    HitPoints:
      type: object
      required:
        - current
        - max
        - temporary
      properties:
        current:
          type: integer
          minimum: 0
          example: 20
        max:
          type: integer
          minimum: 0
          readOnly: true
          example: 34
        temporary:
          type: integer
          minimum: 0
          example: 0

    AbilityScore:
      type: object
      required:
        - score
        - modifier
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 30
          example: 16
        modifier:
          type: integer
          readOnly: true
          example: 3

    AbilityScores:
      type: object
      required:
        - str
        - dex
        - con
        - int
        - wis
        - cha
      properties:
        str:
          $ref: '#/components/schemas/AbilityScore'
        dex:
          $ref: '#/components/schemas/AbilityScore'
        con:
          $ref: '#/components/schemas/AbilityScore'
        int:
          $ref: '#/components/schemas/AbilityScore'
        wis:
          $ref: '#/components/schemas/AbilityScore'
        cha:
          $ref: '#/components/schemas/AbilityScore'

    CampaignRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CampaignName'

    # --- PERSONNAGES : RÉSUMÉS ---
    CharacterBrief:
      type: object
      description: >-
        Résumé d'un personnage dans le contexte d'une campagne (liste des membres, myCharacter), par
        exemple « Arwen · Haut-elfe · Rôdeuse niv. 3 ». species et class sont null tant que le
        personnage est en brouillon.
      required:
        - id
        - name
        - status
        - level
        - species
        - class
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CharacterName'
        status:
          $ref: '#/components/schemas/CharacterStatus'
        level:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        species:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        class:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'

    CharacterSummary:
      description: 'Résumé de personnage pour la liste de ses propres personnages, avec sa campagne.'
      allOf:
        - $ref: '#/components/schemas/CharacterBrief'
        - type: object
          required:
            - campaign
          properties:
            campaign:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/CampaignRef'

    CharacterSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSummary'
        nextCursor:
          type: string
          nullable: true
          description: 'Curseur de la page suivante ; null sur la dernière page.'

    # --- PERSONNAGES : VUES ---
    CharacterPartyView:
      type: object
      description: >-
        Vue d'un autre joueur de la campagne : identité, PV exacts et états seulement. On partage le
        minimum : le reste de la fiche n'est jamais envoyé.
      required:
        - view
        - id
        - name
        - owner
        - level
        - species
        - class
        - hitPoints
        - conditions
      properties:
        view:
          type: string
          enum:
            - party
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CharacterName'
        owner:
          $ref: '#/components/schemas/UserPublic'
        level:
          type: integer
          minimum: 1
          maximum: 5
        species:
          $ref: '#/components/schemas/RuleRef'
        class:
          $ref: '#/components/schemas/RuleRef'
        hitPoints:
          $ref: '#/components/schemas/HitPoints'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'

    InventoryEntry:
      type: object
      required:
        - id
        - item
        - customName
        - quantity
        - equipped
        - weight
      properties:
        id:
          $ref: '#/components/schemas/Id'
        item:
          description: 'Objet SRD ; null pour un objet hors SRD décrit par customName.'
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        customName:
          type: string
          nullable: true
          maxLength: 60
        quantity:
          type: integer
          minimum: 1
          example: 1
        equipped:
          type: boolean
          example: true
        weight:
          type: number
          minimum: 0
          readOnly: true
          description: 'Poids total de la ligne, en kilogrammes.'
          example: 5

    CharacterSheet:
      type: object
      description: >-
        Fiche complète, commune aux vues owner et gm. Ne contient pas les notes du joueur, réservées à
        la vue owner. Les statistiques dérivées sont calculées par le serveur (readOnly). Distances en
        mètres et poids en kilogrammes (ADR 0009).
        Tous les champs sont présents ; les champs nullables liés à la création valent null uniquement
        lorsque status vaut draft. subclass, spellcasting et campaign peuvent valoir null même pour un
        personnage actif. Les tableaux ne sont jamais null : ils sont vides tant que le choix n'est pas fait.
      required:
        - id
        - name
        - status
        - level
        - owner
        - species
        - class
        - subclass
        - background
        - abilities
        - proficiencyBonus
        - armorClass
        - initiative
        - speed
        - passivePerception
        - hitPoints
        - hitDice
        - deathSaves
        - savingThrows
        - skills
        - proficiencies
        - features
        - spellcasting
        - inventory
        - currency
        - carryWeight
        - conditions
        - campaign
        - rulesetVersion
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CharacterName'
        status:
          $ref: '#/components/schemas/CharacterStatus'
        level:
          type: integer
          minimum: 1
          maximum: 5
        owner:
          $ref: '#/components/schemas/UserPublic'
        species:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        class:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        subclass:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        background:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        abilities:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AbilityScores'
        proficiencyBonus:
          type: integer
          readOnly: true
          example: 2
        armorClass:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ValueBreakdown'
        initiative:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ValueBreakdown'
        speed:
          type: number
          nullable: true
          readOnly: true
          description: 'Vitesse en mètres (30 pieds = 9 m).'
          example: 9
        passivePerception:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ValueBreakdown'
        hitPoints:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HitPoints'
        hitDice:
          type: object
          nullable: true
          required:
            - die
            - total
            - remaining
          properties:
            die:
              type: string
              pattern: '^d(4|6|8|10|12|20)$'
              example: 'd10'
            total:
              type: integer
              minimum: 0
            remaining:
              type: integer
              minimum: 0
        deathSaves:
          type: object
          readOnly: true
          description: 'Mis à jour uniquement par le serveur, à partir des jets contre la mort.'
          required:
            - successes
            - failures
          properties:
            successes:
              type: integer
              minimum: 0
              maximum: 3
            failures:
              type: integer
              minimum: 0
              maximum: 3
        savingThrows:
          type: array
          readOnly: true
          items:
            type: object
            required:
              - ability
              - modifier
              - proficient
            properties:
              ability:
                $ref: '#/components/schemas/AbilityCode'
              modifier:
                type: integer
              proficient:
                type: boolean
        skills:
          type: array
          readOnly: true
          items:
            type: object
            required:
              - skill
              - ability
              - modifier
              - proficient
            properties:
              skill:
                $ref: '#/components/schemas/RuleRef'
              ability:
                $ref: '#/components/schemas/AbilityCode'
              modifier:
                type: integer
              proficient:
                type: boolean
        proficiencies:
          type: object
          readOnly: true
          required:
            - armor
            - weapons
            - tools
            - languages
          properties:
            armor:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
            weapons:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
            tools:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
            languages:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
        features:
          type: array
          readOnly: true
          items:
            type: object
            required:
              - id
              - name
              - source
              - level
            properties:
              id:
                $ref: '#/components/schemas/RuleId'
              name:
                type: string
              source:
                $ref: '#/components/schemas/RuleRef'
              level:
                type: integer
                minimum: 1
                maximum: 20
        spellcasting:
          type: object
          nullable: true
          readOnly: true
          description: 'null pour un personnage qui ne lance pas de sorts.'
          required:
            - ability
            - saveDc
            - attackBonus
            - slots
            - spells
          properties:
            ability:
              $ref: '#/components/schemas/AbilityCode'
            saveDc:
              type: integer
              example: 13
            attackBonus:
              type: integer
              example: 5
            slots:
              type: array
              items:
                type: object
                required:
                  - level
                  - max
                  - used
                properties:
                  level:
                    type: integer
                    minimum: 1
                    maximum: 9
                  max:
                    type: integer
                    minimum: 0
                  used:
                    type: integer
                    minimum: 0
            spells:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEntry'
        currency:
          $ref: '#/components/schemas/Currency'
        carryWeight:
          type: object
          nullable: true
          readOnly: true
          description: 'Charge portée et capacité, en kilogrammes.'
          required:
            - current
            - capacity
          properties:
            current:
              type: number
              minimum: 0
            capacity:
              type: number
              minimum: 0
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'
        campaign:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CampaignRef'
        creation:
          type: object
          description: 'Facultatif : présent seulement pour un brouillon, absent une fois le personnage finalisé.'
          required:
            - abilityMethod
            - completedSteps
            - warnings
          properties:
            abilityMethod:
              allOf:
                - $ref: '#/components/schemas/AbilityMethod'
              nullable: true
              type: string
            completedSteps:
              type: array
              items:
                $ref: '#/components/schemas/CreationStep'
            warnings:
              type: array
              items:
                type: object
                required:
                  - code
                properties:
                  code:
                    type: string
                    description: "Code d'avertissement en anglais, traduit par le client."
                    example: 'spells_not_chosen'
                  groupId:
                    type: string
                    description: 'Groupe de choix concerné, le cas échéant.'
        rulesetVersion:
          type: string
          readOnly: true
          description: "Version de l'import SRD utilisée pour le calcul de la fiche."
          example: 'srd-5.1-2026.10'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Currency:
      type: object
      required:
        - cp
        - sp
        - ep
        - gp
        - pp
      properties:
        cp:
          type: integer
          minimum: 0
        sp:
          type: integer
          minimum: 0
        ep:
          type: integer
          minimum: 0
        gp:
          type: integer
          minimum: 0
        pp:
          type: integer
          minimum: 0

    CharacterOwnerView:
      description: 'Vue du propriétaire : la fiche complète et ses notes.'
      allOf:
        - $ref: '#/components/schemas/CharacterSheet'
        - type: object
          required:
            - view
            - notes
          properties:
            view:
              type: string
              enum:
                - owner
            notes:
              type: string
              maxLength: 10000
              default: ''
              description: 'Notes du joueur. Jamais envoyées au MJ ni aux autres joueurs.'

    CharacterGmView:
      description: 'Vue du MJ de la campagne : la fiche complète, sans les notes du joueur.'
      allOf:
        - $ref: '#/components/schemas/CharacterSheet'
        - type: object
          required:
            - view
          properties:
            view:
              type: string
              enum:
                - gm

    CharacterView:
      description: 'Vue du personnage selon le lecteur (projection par spectateur).'
      oneOf:
        - $ref: '#/components/schemas/CharacterOwnerView'
        - $ref: '#/components/schemas/CharacterGmView'
        - $ref: '#/components/schemas/CharacterPartyView'
      discriminator:
        propertyName: view
        mapping:
          owner: '#/components/schemas/CharacterOwnerView'
          gm: '#/components/schemas/CharacterGmView'
          party: '#/components/schemas/CharacterPartyView'

    # --- PERSONNAGES : CRÉATION ---
    AbilityMethod:
      type: string
      enum:
        - pointBuy
        - standardArray
        - roll
      description: 'Méthode de détermination des caractéristiques.'

    ChoiceOption:
      type: object
      required:
        - id
        - grants
      properties:
        id:
          type: string
          maxLength: 64
          example: 'chain-mail'
        grants:
          type: array
          description: 'Ce que donne cette option : une compétence, un lot (une armure, un arc long et 20 flèches), ou un bonus de caractéristique (demi-elfe : +1 dans deux caractéristiques au choix).'
          items:
            $ref: '#/components/schemas/ChoiceGrant'

    ChoiceGrant:
      oneOf:
        - $ref: '#/components/schemas/RefGrant'
        - $ref: '#/components/schemas/AbilityBonusGrant'
      discriminator:
        propertyName: kind
        mapping:
          ref: '#/components/schemas/RefGrant'
          abilityBonus: '#/components/schemas/AbilityBonusGrant'

    RefGrant:
      type: object
      required:
        - kind
        - ref
        - quantity
      properties:
        kind:
          type: string
          enum:
            - ref
        ref:
          $ref: '#/components/schemas/RuleRef'
        quantity:
          type: integer
          minimum: 1

    AbilityBonusGrant:
      type: object
      required:
        - kind
        - ability
        - value
      properties:
        kind:
          type: string
          enum:
            - abilityBonus
        ability:
          $ref: '#/components/schemas/AbilityCode'
        value:
          type: integer
          minimum: 1
          maximum: 2

    ChoiceGroup:
      type: object
      description: 'Un choix de création décrit en données : choisir choose options parmi options.'
      required:
        - id
        - choose
        - options
        - chosen
      properties:
        id:
          type: string
          maxLength: 64
          example: 'class-skills'
        choose:
          type: integer
          minimum: 1
          example: 2
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        chosen:
          type: array
          items:
            type: string
            maxLength: 64

    AbilityOptions:
      type: object
      required:
        - methods
        - pointBuyBudget
        - pointBuyCosts
        - standardArray
        - rolledValues
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/AbilityMethod'
        pointBuyBudget:
          type: integer
          example: 27
        pointBuyCosts:
          type: array
          items:
            type: object
            required:
              - score
              - cost
            properties:
              score:
                type: integer
              cost:
                type: integer
        standardArray:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: integer
          example: [15, 14, 13, 12, 10, 8]
        rolledValues:
          type: array
          nullable: true
          minItems: 6
          maxItems: 6
          description: "Les 6 totaux tirés par le serveur ; null tant que le tirage n'a pas eu lieu."
          items:
            type: integer

    CreationOptions:
      type: object
      required:
        - step
        - groups
      properties:
        step:
          $ref: '#/components/schemas/CreationStep'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceGroup'
        abilities:
          description: "Présent seulement à l'étape abilities."
          allOf:
            - $ref: '#/components/schemas/AbilityOptions'

    # --- PERSONNAGES : ENTRÉES ---
    CreateCharacterInput:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/CharacterName'

    UpdateCharacterInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/CharacterName'
        notes:
          type: string
          maxLength: 10000

    UpdateCreationInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        abilityMethod:
          $ref: '#/components/schemas/AbilityMethod'
        abilityAssignment:
          type: object
          additionalProperties: false
          description: >-
            Score de chaque caractéristique. Avec la méthode roll, les valeurs doivent être une
            permutation des valeurs tirées par le serveur.
          required:
            - str
            - dex
            - con
            - int
            - wis
            - cha
          properties:
            str:
              type: integer
              minimum: 1
              maximum: 30
            dex:
              type: integer
              minimum: 1
              maximum: 30
            con:
              type: integer
              minimum: 1
              maximum: 30
            int:
              type: integer
              minimum: 1
              maximum: 30
            wis:
              type: integer
              minimum: 1
              maximum: 30
            cha:
              type: integer
              minimum: 1
              maximum: 30
        choices:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - groupId
              - optionIds
            properties:
              groupId:
                type: string
                maxLength: 64
              optionIds:
                type: array
                maxItems: 50
                items:
                  type: string
                  maxLength: 64

    # --- DÉS ---
    DiceExpression:
      type: string
      minLength: 1
      maxLength: 100
      description: 'Expression de dés (grammaire : docs/technique/notation-des-des.md). Casse et espaces ignorés.'
      example: '2d6+3'

    Advantage:
      type: string
      enum:
        - none
        - advantage
        - disadvantage
      default: none
      description: "Avantage ou désavantage : le serveur réécrit l'unique terme 1d20 en 2d20kh1 ou 2d20kl1."

    RollVisibility:
      type: string
      enum:
        - public
        - private
        - hidden
      description: >-
        public : toute la campagne (joueur ou MJ) ; private : le lanceur et le MJ (joueur seulement, et
        toujours pour un jet personnel) ; hidden : le MJ seul (MJ seulement).

    DieResult:
      type: object
      required:
        - value
        - kept
        - rerolledFrom
        - fromExplosion
      properties:
        value:
          type: integer
          minimum: 1
          description: 'Valeur finale du dé.'
        kept:
          type: boolean
        rerolledFrom:
          type: integer
          nullable: true
          description: "Valeur remplacée par la relance ; null si le dé n'a pas été relancé."
        fromExplosion:
          type: boolean
          description: 'Dé ajouté par une explosion.'

    DiceTerm:
      type: object
      required:
        - kind
        - sign
        - count
        - sides
        - keep
        - explode
        - reroll
        - dice
        - subtotal
      properties:
        kind:
          type: string
          enum:
            - dice
        sign:
          $ref: '#/components/schemas/TermSign'
        count:
          type: integer
          minimum: 1
          maximum: 100
        sides:
          type: integer
          minimum: 2
          maximum: 100
        keep:
          type: object
          nullable: true
          required:
            - mode
            - count
          properties:
            mode:
              type: string
              enum:
                - highest
                - lowest
            count:
              type: integer
              minimum: 1
        explode:
          type: boolean
        reroll:
          type: object
          nullable: true
          description: 'equal : relance les dés qui font value ; atMost : relance les dés qui font value ou moins. Une seule relance par dé.'
          required:
            - mode
            - value
          properties:
            mode:
              type: string
              enum:
                - equal
                - atMost
            value:
              type: integer
              minimum: 1
        dice:
          type: array
          items:
            $ref: '#/components/schemas/DieResult'
        subtotal:
          type: integer
          description: 'Somme des dés gardés, sans le signe.'
      example:
        kind: dice
        sign: plus
        count: 4
        sides: 6
        keep:
          mode: highest
          count: 3
        explode: false
        reroll: null
        dice:
          - { value: 6, kept: true, rerolledFrom: null, fromExplosion: false }
          - { value: 5, kept: true, rerolledFrom: null, fromExplosion: false }
          - { value: 3, kept: true, rerolledFrom: null, fromExplosion: false }
          - { value: 2, kept: false, rerolledFrom: null, fromExplosion: false }
        subtotal: 14

    ConstantTerm:
      type: object
      required:
        - kind
        - sign
        - value
      properties:
        kind:
          type: string
          enum:
            - constant
        sign:
          $ref: '#/components/schemas/TermSign'
        value:
          type: integer
          minimum: 0
          maximum: 1000

    TermSign:
      type: string
      enum:
        - plus
        - minus

    RollTerm:
      oneOf:
        - $ref: '#/components/schemas/DiceTerm'
        - $ref: '#/components/schemas/ConstantTerm'
      discriminator:
        propertyName: kind
        mapping:
          dice: '#/components/schemas/DiceTerm'
          constant: '#/components/schemas/ConstantTerm'

    RollContext:
      type: object
      description: >-
        Contexte du jet, à partir duquel l'interface écrit son libellé (par exemple « Perception (SAG) »).
        Les types attack et damage viendront avec la section Combat.
      required:
        - type
        - ref
      properties:
        type:
          type: string
          enum:
            - free
            - skill
            - ability
            - save
            - death
            - abilityScore
        ref:
          description: 'RuleId de la compétence, ou code de caractéristique ; null si le type suffit.'
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RuleId'

    RollResult:
      type: object
      description: 'Jet lancé par le serveur. Aucun numéro séquentiel : il révélerait les jets cachés.'
      required:
        - id
        - expression
        - advantage
        - terms
        - total
        - capped
        - visibility
        - roller
        - character
        - campaignId
        - sessionId
        - context
        - createdAt
      properties:
        id:
          description: "null pour un jet personnel, qui n'est pas enregistré."
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Id'
        expression:
          type: string
          description: 'Forme normalisée, avantage appliqué.'
          example: '2d20kh1+5'
        advantage:
          $ref: '#/components/schemas/Advantage'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/RollTerm'
        total:
          type: integer
          example: 19
        capped:
          type: boolean
          description: 'true si un plafond (400 dés lancés, 10 explosions par dé de base) a arrêté le jet.'
        visibility:
          $ref: '#/components/schemas/RollVisibility'
        roller:
          $ref: '#/components/schemas/UserPublic'
        character:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CharacterRef'
        campaignId:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Id'
        sessionId:
          type: string
          nullable: true
          description: 'Séance pendant laquelle le jet a été lancé ; null hors séance.'
          allOf:
            - $ref: '#/components/schemas/Id'
        context:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RollContext'
        createdAt:
          type: string
          format: date-time

    RollResultPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RollResult'
        nextCursor:
          type: string
          nullable: true
          description: 'Curseur de la page suivante ; null sur la dernière page.'

    DiceProbabilities:
      type: object
      required:
        - expression
        - min
        - max
        - mean
        - distribution
      properties:
        expression:
          type: string
          example: '2d6'
        min:
          type: integer
          example: 2
        max:
          type: integer
          example: 12
        mean:
          type: number
          example: 7
        distribution:
          type: array
          maxItems: 2000
          description: 'Probabilité exacte de chaque total, triée par total. La somme vaut 1.'
          items:
            type: object
            required:
              - total
              - probability
            properties:
              total:
                type: integer
              probability:
                type: number
                minimum: 0
                maximum: 1

    RollInput:
      type: object
      required:
        - expression
      additionalProperties: false
      properties:
        expression:
          $ref: '#/components/schemas/DiceExpression'
        advantage:
          $ref: '#/components/schemas/Advantage'
        visibility:
          description: 'public par défaut dans une campagne ; private, seule valeur possible, pour un jet personnel.'
          allOf:
            - $ref: '#/components/schemas/RollVisibility'
        campaignId:
          $ref: '#/components/schemas/Id'
        characterId:
          $ref: '#/components/schemas/Id'

    ProbabilityInput:
      type: object
      required:
        - expression
      additionalProperties: false
      properties:
        expression:
          $ref: '#/components/schemas/DiceExpression'
        advantage:
          $ref: '#/components/schemas/Advantage'

    # --- PERSONNAGES : ACTIONS DE JEU ---
    CharacterSheetView:
      description: >-
        Vue de la fiche complète selon le lecteur, renvoyée par les actions de jeu : owner pour le
        propriétaire, gm pour le MJ (sans les notes).
      oneOf:
        - $ref: '#/components/schemas/CharacterOwnerView'
        - $ref: '#/components/schemas/CharacterGmView'
      discriminator:
        propertyName: view
        mapping:
          owner: '#/components/schemas/CharacterOwnerView'
          gm: '#/components/schemas/CharacterGmView'

    CharacterActionResult:
      type: object
      description: "Résultat d'une action qui lance des dés : la fiche mise à jour et les jets du serveur."
      required:
        - character
        - rolls
      properties:
        character:
          $ref: '#/components/schemas/CharacterSheetView'
        rolls:
          type: array
          description: "Jets lancés par le serveur pour cette action ; vide si aucun dé n'a été lancé."
          items:
            $ref: '#/components/schemas/RollResult'

    AbilityRolls:
      type: object
      required:
        - rolls
      properties:
        rolls:
          type: array
          minItems: 6
          maxItems: 6
          description: 'Six jets 4d6kh3, de contexte abilityScore et de visibilité private.'
          items:
            $ref: '#/components/schemas/RollResult'

    LevelUpOptions:
      type: object
      x-phase: P3
      required:
        - fromLevel
        - toLevel
        - hitPoints
        - grantedFeatures
        - groups
        - abilityIncrease
      properties:
        fromLevel:
          type: integer
          minimum: 1
          maximum: 4
        toLevel:
          type: integer
          minimum: 2
          maximum: 5
        hitPoints:
          type: object
          required:
            - die
            - average
          properties:
            die:
              type: string
              pattern: '^d(4|6|8|10|12|20)$'
              example: 'd10'
            average:
              type: integer
              example: 6
        grantedFeatures:
          type: array
          description: "Capacités obtenues d'office à ce niveau."
          items:
            $ref: '#/components/schemas/RuleRef'
        groups:
          type: array
          description: 'Choix à faire (sous-classe, sorts…), au même format que la création.'
          items:
            $ref: '#/components/schemas/ChoiceGroup'
        abilityIncrease:
          type: object
          nullable: true
          description: 'Augmentation de caractéristiques offerte à ce niveau ; null sinon.'
          required:
            - points
            - maxPerAbility
            - cap
          properties:
            points:
              type: integer
              example: 2
            maxPerAbility:
              type: integer
              example: 2
            cap:
              type: integer
              example: 20

    HitPointsAdjustmentInput:
      description: 'amount (corrections du MJ) ou dice (lancés par le serveur), jamais les deux.'
      oneOf:
        - type: object
          title: HitPointsAmount
          required:
            - kind
            - amount
          additionalProperties: false
          properties:
            kind:
              $ref: '#/components/schemas/HitPointsAdjustmentKind'
            amount:
              type: integer
              minimum: 1
              maximum: 999
        - type: object
          title: HitPointsDice
          required:
            - kind
            - dice
          additionalProperties: false
          properties:
            kind:
              $ref: '#/components/schemas/HitPointsAdjustmentKind'
            dice:
              $ref: '#/components/schemas/DiceExpression'

    HitPointsAdjustmentKind:
      type: string
      enum:
        - damage
        - healing
        - temporary
      description: 'Dégâts, soins, ou PV temporaires.'

    RestInput:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - short
            - long
        hitDiceToSpend:
          type: integer
          minimum: 0
          maximum: 20
          description: 'Repos court seulement : nombre de dés de vie à dépenser.'

    UpdateResourcesInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        spellSlotsUsed:
          type: array
          maxItems: 9
          items:
            type: object
            additionalProperties: false
            required:
              - level
              - used
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 9
              used:
                type: integer
                minimum: 0
        hitDiceRemaining:
          type: integer
          minimum: 0

    AddInventoryItemInput:
      description: 'Un objet SRD (itemId) ou un objet hors SRD (customName), jamais les deux.'
      oneOf:
        - type: object
          title: SrdItem
          required:
            - itemId
          additionalProperties: false
          properties:
            itemId:
              $ref: '#/components/schemas/RuleId'
            quantity:
              type: integer
              minimum: 1
              maximum: 999
              default: 1
        - type: object
          title: CustomItem
          required:
            - customName
          additionalProperties: false
          properties:
            customName:
              type: string
              minLength: 1
              maxLength: 60
            quantity:
              type: integer
              minimum: 1
              maximum: 999
              default: 1

    UpdateInventoryItemInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        equipped:
          type: boolean

    CurrencyInput:
      type: object
      required:
        - cp
        - sp
        - ep
        - gp
        - pp
      additionalProperties: false
      properties:
        cp:
          type: integer
          minimum: 0
        sp:
          type: integer
          minimum: 0
        ep:
          type: integer
          minimum: 0
        gp:
          type: integer
          minimum: 0
        pp:
          type: integer
          minimum: 0

    CheckInput:
      description: >-
        Test avec une clé (compétence, caractéristique, sauvegarde) ou jet contre la mort, sans clé. Le
        serveur renvoie key_required ou key_not_allowed dans FieldError.code si la validation échoue.
      oneOf:
        - $ref: '#/components/schemas/KeyedCheckInput'
        - $ref: '#/components/schemas/DeathSaveInput'
      discriminator:
        propertyName: type
        mapping:
          skill: '#/components/schemas/KeyedCheckInput'
          ability: '#/components/schemas/KeyedCheckInput'
          save: '#/components/schemas/KeyedCheckInput'
          death: '#/components/schemas/DeathSaveInput'

    KeyedCheckInput:
      type: object
      required:
        - type
        - key
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - skill
            - ability
            - save
        key:
          description: 'RuleId de la compétence (type skill) ou code de caractéristique (types ability et save).'
          allOf:
            - $ref: '#/components/schemas/RuleId'
        advantage:
          $ref: '#/components/schemas/Advantage'
        visibility:
          $ref: '#/components/schemas/RollVisibility'

    DeathSaveInput:
      type: object
      required:
        - type
      additionalProperties: false
      description: 'Jet contre la mort : aucune clé, un key envoyé est refusé.'
      properties:
        type:
          type: string
          enum:
            - death
        advantage:
          $ref: '#/components/schemas/Advantage'
        visibility:
          $ref: '#/components/schemas/RollVisibility'

    LevelUpInput:
      type: object
      required:
        - hitPointMethod
      additionalProperties: false
      x-phase: P3
      properties:
        hitPointMethod:
          type: string
          enum:
            - average
            - roll
          description: 'average : la valeur moyenne du dé de vie ; roll : le serveur lance le dé.'
        choices:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - groupId
              - optionIds
            properties:
              groupId:
                type: string
                maxLength: 64
              optionIds:
                type: array
                maxItems: 50
                items:
                  type: string
                  maxLength: 64
        abilityIncreases:
          type: object
          additionalProperties: false
          description: 'Points ajoutés à chaque caractéristique, par exemple { dex: 2 }.'
          properties:
            str:
              type: integer
              minimum: 1
              maximum: 2
            dex:
              type: integer
              minimum: 1
              maximum: 2
            con:
              type: integer
              minimum: 1
              maximum: 2
            int:
              type: integer
              minimum: 1
              maximum: 2
            wis:
              type: integer
              minimum: 1
              maximum: 2
            cha:
              type: integer
              minimum: 1
              maximum: 2

    # --- CARTES : GRILLE ET CASES ---
    GridType:
      type: string
      enum:
        - square
        - hex
      description: 'Grille carrée ou hexagonale. Murs et portes seulement sur une grille carrée (MVP).'

    GridSpec:
      type: object
      description: >-
        Coordonnées lisibles, pour la carte et sa vue textuelle : colonnes A, B, … Z, AA…, lignes à partir
        de 1 (C4 = col 2, row 3). Grille hexagonale : coordonnées décalées odd-r. Une case vaut 1,5 m,
        diagonales comprises (règles de base du SRD 5.1, ADR 0009).
      required:
        - type
        - cols
        - rows
        - cellSizeMeters
      properties:
        type:
          $ref: '#/components/schemas/GridType'
        cols:
          type: integer
          minimum: 1
          maximum: 100
        rows:
          type: integer
          minimum: 1
          maximum: 100
        cellSizeMeters:
          type: number
          enum:
            - 1.5
          readOnly: true

    Cell:
      type: object
      required:
        - col
        - row
      properties:
        col:
          type: integer
          minimum: 0
          maximum: 99
        row:
          type: integer
          minimum: 0
          maximum: 99

    Vertex:
      type: object
      description: 'Sommet de la grille carrée : (0, 0) est le coin haut gauche de la case (0, 0).'
      required:
        - x
        - y
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 100
        y:
          type: integer
          minimum: 0
          maximum: 100

    CellSet:
      type: object
      description: >-
        Ensemble de cases, une case par bit. La case (col, row) porte l'indice i = row × cols + col, la
        ligne 0 en haut et la colonne 0 à gauche. L'octet k contient les cases 8k à 8k + 7, bit de poids
        fort en premier ; le dernier octet est complété par des zéros. data est encodé en base64 standard
        (RFC 4648), avec remplissage. La longueur décodée vaut exactement ceil(cols × rows / 8) octets,
        sinon 400. Exemple : grille 3 × 2, cases (0, 0) et (2, 1) → bits 100001 → octet 10000100 (0x84)
        → "hA==".
      required:
        - encoding
        - data
      properties:
        encoding:
          type: string
          enum:
            - bitset
        data:
          type: string
          format: byte
          maxLength: 1700
      example:
        encoding: bitset
        data: 'hA=='

    HealthState:
      type: string
      enum:
        - unharmed
        - wounded
        - down
      description: "État approximatif d'une créature pour les joueurs : wounded dès 1 PV perdu, down à 0 PV."

    # --- CARTES : GÉOMÉTRIE ---
    MapBackground:
      type: object
      description: 'Fond découpé en tuiles de 8 × 8 cases ; une case fait 64 pixels, une tuile 512.'
      required:
        - tileSize
        - cellPixels
        - tilesX
        - tilesY
      properties:
        tileSize:
          type: integer
          enum:
            - 512
        cellPixels:
          type: integer
          enum:
            - 64
        tilesX:
          type: integer
          minimum: 1
          maximum: 13
        tilesY:
          type: integer
          minimum: 1
          maximum: 13

    MapBackgroundParty:
      description: "Fond vu par les joueurs : seules les tuiles qui ne sont pas entièrement cachées sont listées, avec leur empreinte de masque. Une tuile absente de la liste n'est pas demandée."
      allOf:
        - $ref: '#/components/schemas/MapBackground'
        - type: object
          required:
            - tiles
          properties:
            tiles:
              type: array
              items:
                type: object
                required:
                  - x
                  - y
                  - mask
                properties:
                  x:
                    type: integer
                    minimum: 0
                  y:
                    type: integer
                    minimum: 0
                  mask:
                    type: string
                    maxLength: 64
                    description: "Empreinte des cases non cachées de la tuile et de la version du fond, à passer dans le paramètre mask de getMapTile. Elle change si le brouillard découvre ou recache une case de la tuile, ou si le MJ renvoie une image ; la différence entre visible et explored n'y entre pas (l'assombrissement se fait côté front). Chaque changement de brouillard envoie par WebSocket la nouvelle liste tiles."

    WallGm:
      type: object
      required:
        - id
        - from
        - to
      properties:
        id:
          $ref: '#/components/schemas/Id'
        from:
          $ref: '#/components/schemas/Vertex'
        to:
          $ref: '#/components/schemas/Vertex'

    WallParty:
      type: object
      description: 'Mur vu par les joueurs, sans identifiant. Une porte secrète est envoyée comme un mur.'
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/Vertex'
        to:
          $ref: '#/components/schemas/Vertex'

    DoorState:
      type: string
      enum:
        - open
        - closed

    DoorGm:
      type: object
      required:
        - id
        - from
        - to
        - state
        - secret
      properties:
        id:
          $ref: '#/components/schemas/Id'
        from:
          $ref: '#/components/schemas/Vertex'
        to:
          $ref: '#/components/schemas/Vertex'
        state:
          $ref: '#/components/schemas/DoorState'
        secret:
          type: boolean

    DoorParty:
      type: object
      description: >-
        Porte vue par les joueurs, sans identifiant. Sur une case explored, state est le dernier état vu
        (instantané pris quand la porte était dans une case visible), jamais l'état actuel.
      required:
        - from
        - to
        - state
      properties:
        from:
          $ref: '#/components/schemas/Vertex'
        to:
          $ref: '#/components/schemas/Vertex'
        state:
          $ref: '#/components/schemas/DoorState'

    AreaGm:
      type: object
      required:
        - id
        - name
        - cells
        - public
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/AreaName'
        cells:
          $ref: '#/components/schemas/CellSet'
        public:
          type: boolean

    AreaParty:
      type: object
      description: "Zone publique vue par les joueurs : cells est l'intersection avec les cases visible et explored ; une zone dont l'intersection est vide n'est pas envoyée."
      required:
        - id
        - name
        - cells
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/AreaName'
        cells:
          $ref: '#/components/schemas/CellSet'

    AreaName:
      type: string
      minLength: 1
      maxLength: 60
      example: 'Salle B'

    DecorKind:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64
      description: "Clé d'un catalogue d'icônes libres fourni par le front (par exemple chest)."
      example: 'chest'

    DecorGm:
      type: object
      required:
        - id
        - kind
        - cell
        - rotation
        - layer
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/DecorKind'
        cell:
          $ref: '#/components/schemas/Cell'
        rotation:
          $ref: '#/components/schemas/Rotation'
        layer:
          type: string
          enum:
            - decor
            - gm
          description: 'gm : calque MJ (un piège, un repère), jamais envoyé aux joueurs.'

    DecorParty:
      type: object
      description: 'Décor vu par les joueurs, avec la même règle que les murs : calque decor seulement, jamais le calque gm (les pièges), sur les cases visible ou explored, sans identifiant.'
      required:
        - kind
        - cell
        - rotation
      properties:
        kind:
          $ref: '#/components/schemas/DecorKind'
        cell:
          $ref: '#/components/schemas/Cell'
        rotation:
          $ref: '#/components/schemas/Rotation'

    Rotation:
      type: integer
      enum:
        - 0
        - 90
        - 180
        - 270

    # --- CARTES : PIONS ---
    TokenLayer:
      type: string
      enum:
        - tokens
        - gm
      description: 'gm : calque MJ, jamais envoyé aux joueurs.'

    TokenCondition:
      type: object
      required:
        - condition
        - hidden
      properties:
        condition:
          description: >-
            État du SRD (empoisonné, à terre…). Les effets libres du MJ (« prend feu, 1d4 par tour pendant
            2 tours ») viendront avec la section Combat, qui élargira ce champ par un oneOf.
          allOf:
            - $ref: '#/components/schemas/RuleRef'
        hidden:
          type: boolean
          description: "Effet caché aux joueurs (par exemple un poison qu'ils n'ont pas remarqué)."

    CharacterTokenGm:
      type: object
      required:
        - kind
        - id
        - cell
        - layer
        - characterId
      properties:
        kind:
          type: string
          enum:
            - character
        id:
          $ref: '#/components/schemas/Id'
        cell:
          $ref: '#/components/schemas/Cell'
        layer:
          $ref: '#/components/schemas/TokenLayer'
        characterId:
          $ref: '#/components/schemas/Id'

    CreatureTokenGm:
      type: object
      required:
        - kind
        - id
        - cell
        - layer
        - monster
        - displayName
        - hitPoints
        - conditions
        - hidden
      properties:
        kind:
          type: string
          enum:
            - creature
        id:
          $ref: '#/components/schemas/Id'
        cell:
          $ref: '#/components/schemas/Cell'
        layer:
          $ref: '#/components/schemas/TokenLayer'
        monster:
          $ref: '#/components/schemas/RuleRef'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hitPoints:
          $ref: '#/components/schemas/HitPoints'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TokenCondition'
        hidden:
          type: boolean
          description: "Créature cachée (invisible, en embuscade) : absente des pions et de l'initiative des joueurs."

    TokenGm:
      oneOf:
        - $ref: '#/components/schemas/CharacterTokenGm'
        - $ref: '#/components/schemas/CreatureTokenGm'
      discriminator:
        propertyName: kind
        mapping:
          character: '#/components/schemas/CharacterTokenGm'
          creature: '#/components/schemas/CreatureTokenGm'

    CharacterTokenParty:
      type: object
      required:
        - kind
        - id
        - cell
        - characterId
        - name
        - hitPoints
        - conditions
      properties:
        kind:
          type: string
          enum:
            - character
        id:
          $ref: '#/components/schemas/Id'
        cell:
          $ref: '#/components/schemas/Cell'
        characterId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CharacterName'
        hitPoints:
          $ref: '#/components/schemas/HitPoints'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'

    CreatureTokenParty:
      type: object
      description: >-
        Créature vue par les joueurs, seulement sur une case visible et si elle n'est pas cachée. Jamais
        de monsterId ni de PV : c'est le lien entre le pion et le monstre qui doit rester secret.
      required:
        - kind
        - id
        - cell
        - displayName
        - healthState
        - conditions
      properties:
        kind:
          type: string
          enum:
            - creature
        id:
          $ref: '#/components/schemas/Id'
        cell:
          $ref: '#/components/schemas/Cell'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        healthState:
          $ref: '#/components/schemas/HealthState'
        conditions:
          type: array
          description: 'États SRD visibles des joueurs : sans le champ hidden et sans les états marqués cachés.'
          items:
            $ref: '#/components/schemas/RuleRef'

    TokenParty:
      oneOf:
        - $ref: '#/components/schemas/CharacterTokenParty'
        - $ref: '#/components/schemas/CreatureTokenParty'
      discriminator:
        propertyName: kind
        mapping:
          character: '#/components/schemas/CharacterTokenParty'
          creature: '#/components/schemas/CreatureTokenParty'

    DisplayName:
      type: string
      minLength: 1
      maxLength: 40
      example: 'Silhouette encapuchonnée'

    # --- CARTES : BROUILLARD ET VUES ---
    FogGm:
      type: object
      description: >-
        Si revealAll est vrai, toutes les cases sont visible. Sinon, visible = (ligne de vue des
        personnages si autoReveal) ∪ manualReveals − manualHides. Le filtre des créatures cachées
        s'applique dans tous les cas.
      required:
        - visible
        - explored
        - manualReveals
        - manualHides
      properties:
        visible:
          $ref: '#/components/schemas/CellSet'
        explored:
          $ref: '#/components/schemas/CellSet'
        manualReveals:
          $ref: '#/components/schemas/CellSet'
        manualHides:
          $ref: '#/components/schemas/CellSet'

    FogParty:
      type: object
      description: "Une case qui n'est ni visible ni explored est hidden : les joueurs n'en reçoivent rien, pas même le fond."
      required:
        - visible
        - explored
      properties:
        visible:
          $ref: '#/components/schemas/CellSet'
        explored:
          $ref: '#/components/schemas/CellSet'

    MapGmView:
      type: object
      required:
        - view
        - id
        - name
        - grid
        - background
        - walls
        - doors
        - areas
        - decor
        - tokens
        - fog
        - templates
        - autoReveal
        - revealAll
        - geometryVersion
      properties:
        view:
          type: string
          enum:
            - gm
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/MapName'
        grid:
          $ref: '#/components/schemas/GridSpec'
        background:
          type: object
          nullable: true
          description: "null tant qu'aucun fond n'a été envoyé."
          allOf:
            - $ref: '#/components/schemas/MapBackground'
        walls:
          type: array
          items:
            $ref: '#/components/schemas/WallGm'
        doors:
          type: array
          items:
            $ref: '#/components/schemas/DoorGm'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaGm'
        decor:
          type: array
          items:
            $ref: '#/components/schemas/DecorGm'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenGm'
        fog:
          $ref: '#/components/schemas/FogGm'
        templates:
          type: array
          description: 'Gabarits de zone posés sur la carte.'
          items:
            $ref: '#/components/schemas/MapTemplateGm'
        autoReveal:
          type: boolean
          description: '(P3) La ligne de vue des personnages révèle les cases automatiquement.'
        revealAll:
          type: boolean
          description: 'Toute la carte est visible, sans brouillard (une ville, un plan connu). Faux par défaut.'
        geometryVersion:
          type: integer
          minimum: 0
          description: "Version de la géométrie, renvoyée aussi dans l'en-tête ETag."

    MapPartyView:
      type: object
      description: >-
        Vue des joueurs : uniquement ce qui est sur les cases visible et explored. Créatures seulement sur
        les cases visible et si elles ne sont pas cachées. Rien du calque MJ, pas de porte secrète (envoyée
        comme un mur), pas d'identifiant de mur ni de porte.
      required:
        - view
        - id
        - name
        - grid
        - background
        - walls
        - doors
        - areas
        - decor
        - tokens
        - fog
        - templates
      properties:
        view:
          type: string
          enum:
            - party
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/MapName'
        grid:
          $ref: '#/components/schemas/GridSpec'
        background:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MapBackgroundParty'
        walls:
          type: array
          items:
            $ref: '#/components/schemas/WallParty'
        doors:
          type: array
          items:
            $ref: '#/components/schemas/DoorParty'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaParty'
        decor:
          type: array
          items:
            $ref: '#/components/schemas/DecorParty'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenParty'
        fog:
          $ref: '#/components/schemas/FogParty'
        templates:
          type: array
          description: 'Gabarits publics seulement, sans identifiant.'
          items:
            $ref: '#/components/schemas/MapTemplateParty'

    MapView:
      oneOf:
        - $ref: '#/components/schemas/MapGmView'
        - $ref: '#/components/schemas/MapPartyView'
      discriminator:
        propertyName: view
        mapping:
          gm: '#/components/schemas/MapGmView'
          party: '#/components/schemas/MapPartyView'

    MapName:
      type: string
      minLength: 1
      maxLength: 60
      example: 'Mine de Phandelver'

    MapSummary:
      type: object
      required:
        - id
        - name
        - grid
        - active
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/MapName'
        grid:
          $ref: '#/components/schemas/GridSpec'
        active:
          type: boolean
          description: 'Carte affichée en ce moment.'
        updatedAt:
          type: string
          format: date-time

    MapSummaryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MapSummary'
        nextCursor:
          type: string
          nullable: true

    # --- CARTES : SCÈNE ET INITIATIVE ---
    InitiativeEntryGm:
      type: object
      required:
        - tokenId
        - score
        - hidden
      properties:
        tokenId:
          $ref: '#/components/schemas/Id'
        score:
          type: integer
        hidden:
          type: boolean

    CharacterInitiativeParty:
      type: object
      required:
        - kind
        - tokenId
        - characterId
        - name
        - hitPoints
      properties:
        kind:
          type: string
          enum:
            - character
        tokenId:
          $ref: '#/components/schemas/Id'
        characterId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/CharacterName'
        hitPoints:
          $ref: '#/components/schemas/HitPoints'

    CreatureInitiativeParty:
      type: object
      description: 'Créature déjà vue pendant ce combat. Sortie du champ de vision, healthState est le dernier état vu.'
      required:
        - kind
        - tokenId
        - displayName
        - healthState
      properties:
        kind:
          type: string
          enum:
            - creature
        tokenId:
          $ref: '#/components/schemas/Id'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        healthState:
          $ref: '#/components/schemas/HealthState'

    InitiativeEntryParty:
      description: "Entrée de l'initiative vue par les joueurs, sans score : l'ordre du tableau donne l'ordre de jeu."
      oneOf:
        - $ref: '#/components/schemas/CharacterInitiativeParty'
        - $ref: '#/components/schemas/CreatureInitiativeParty'
      discriminator:
        propertyName: kind
        mapping:
          character: '#/components/schemas/CharacterInitiativeParty'
          creature: '#/components/schemas/CreatureInitiativeParty'

    SceneGmView:
      type: object
      required:
        - view
        - activeMap
        - round
        - initiative
        - currentTurn
      properties:
        view:
          type: string
          enum:
            - gm
        activeMap:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MapGmView'
        round:
          type: integer
          nullable: true
          minimum: 1
          description: 'null hors combat.'
        initiative:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeEntryGm'
        currentTurn:
          type: string
          nullable: true
          description: "tokenId dont c'est le tour ; null hors combat."
          allOf:
            - $ref: '#/components/schemas/Id'

    ScenePartyView:
      type: object
      required:
        - view
        - activeMap
        - round
        - initiative
        - currentTurn
      properties:
        view:
          type: string
          enum:
            - party
        activeMap:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MapPartyView'
        round:
          type: integer
          nullable: true
          minimum: 1
        initiative:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeEntryParty'
        currentTurn:
          type: string
          nullable: true
          description: "tokenId dont c'est le tour ; null hors combat et pendant le tour d'une créature cachée."
          allOf:
            - $ref: '#/components/schemas/Id'

    SceneView:
      oneOf:
        - $ref: '#/components/schemas/SceneGmView'
        - $ref: '#/components/schemas/ScenePartyView'
      discriminator:
        propertyName: view
        mapping:
          gm: '#/components/schemas/SceneGmView'
          party: '#/components/schemas/ScenePartyView'

    # --- CARTES : JETONS D'AFFICHAGE ---
    DisplaySessionCreated:
      type: object
      required:
        - id
        - token
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        token:
          type: string
          description: "Jeton d'affichage, renvoyé uniquement à la création."
          example: 'dsp_4f9c2a7e1b3d8f6a0c5e9b2d7a1f3c8e'
        expiresAt:
          type: string
          format: date-time

    DisplaySession:
      type: object
      required:
        - id
        - createdAt
        - expiresAt
        - lastUsedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    DisplaySessionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisplaySession'
        nextCursor:
          type: string
          nullable: true

    # --- CARTES : ENTRÉES ---
    CreateMapInput:
      type: object
      required:
        - name
        - grid
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MapName'
        grid:
          type: object
          additionalProperties: false
          required:
            - type
            - cols
            - rows
          properties:
            type:
              $ref: '#/components/schemas/GridType'
            cols:
              type: integer
              minimum: 1
              maximum: 100
            rows:
              type: integer
              minimum: 1
              maximum: 100

    UpdateMapInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MapName'
        autoReveal:
          type: boolean
        revealAll:
          type: boolean

    MapGeometryInput:
      type: object
      description: 'Un élément avec id est conservé, sans id il est créé, absent il est supprimé. Les plafonds protègent aussi le calcul de la ligne de vue.'
      required:
        - walls
        - doors
        - areas
        - decor
      additionalProperties: false
      x-phase: P3
      properties:
        walls:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required:
              - from
              - to
            properties:
              id:
                $ref: '#/components/schemas/Id'
              from:
                $ref: '#/components/schemas/Vertex'
              to:
                $ref: '#/components/schemas/Vertex'
        doors:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - from
              - to
              - state
              - secret
            properties:
              id:
                $ref: '#/components/schemas/Id'
              from:
                $ref: '#/components/schemas/Vertex'
              to:
                $ref: '#/components/schemas/Vertex'
              state:
                $ref: '#/components/schemas/DoorState'
              secret:
                type: boolean
        areas:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - cells
              - public
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                $ref: '#/components/schemas/AreaName'
              cells:
                $ref: '#/components/schemas/CellSet'
              public:
                type: boolean
        decor:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - cell
              - rotation
              - layer
            properties:
              id:
                $ref: '#/components/schemas/Id'
              kind:
                $ref: '#/components/schemas/DecorKind'
              cell:
                $ref: '#/components/schemas/Cell'
              rotation:
                $ref: '#/components/schemas/Rotation'
              layer:
                type: string
                enum:
                  - decor
                  - gm

    UpdateDoorInput:
      type: object
      required:
        - state
      additionalProperties: false
      x-phase: P3
      properties:
        state:
          $ref: '#/components/schemas/DoorState'

    FogUpdateInput:
      x-phase: P3
      oneOf:
        - $ref: '#/components/schemas/FogCellsInput'
        - $ref: '#/components/schemas/FogResetInput'
      discriminator:
        propertyName: action
        mapping:
          reveal: '#/components/schemas/FogCellsInput'
          hide: '#/components/schemas/FogCellsInput'
          reset: '#/components/schemas/FogResetInput'

    FogCellsInput:
      type: object
      required:
        - action
        - cells
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - reveal
            - hide
        cells:
          $ref: '#/components/schemas/CellSet'

    FogResetInput:
      type: object
      description: 'Vide les révélations et les masquages manuels.'
      required:
        - action
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - reset

    CreateMapTokenInput:
      oneOf:
        - $ref: '#/components/schemas/CreateCharacterTokenInput'
        - $ref: '#/components/schemas/CreateCreatureTokenInput'
      discriminator:
        propertyName: kind
        mapping:
          character: '#/components/schemas/CreateCharacterTokenInput'
          creature: '#/components/schemas/CreateCreatureTokenInput'

    CreateCharacterTokenInput:
      type: object
      required:
        - kind
        - characterId
        - cell
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - character
        characterId:
          $ref: '#/components/schemas/Id'
        cell:
          $ref: '#/components/schemas/Cell'

    CreateCreatureTokenInput:
      type: object
      required:
        - kind
        - monsterId
        - cell
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - creature
        monsterId:
          $ref: '#/components/schemas/RuleId'
        cell:
          $ref: '#/components/schemas/Cell'
        displayName:
          description: 'Le nom du monstre par défaut.'
          allOf:
            - $ref: '#/components/schemas/DisplayName'
        hidden:
          type: boolean
          default: false
        layer:
          allOf:
            - $ref: '#/components/schemas/TokenLayer'
          default: tokens
        hitPointMethod:
          type: string
          enum:
            - average
            - roll
          default: average
          description: 'average : PV moyens du monstre ; roll : le serveur lance ses dés de vie.'

    UpdateMapTokenInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        cell:
          $ref: '#/components/schemas/Cell'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hidden:
          type: boolean
        layer:
          $ref: '#/components/schemas/TokenLayer'

    SetActiveMapInput:
      type: object
      required:
        - mapId
      additionalProperties: false
      properties:
        mapId:
          description: 'null : aucune carte affichée.'
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Id'

    # --- DONNÉES SRD : VALEURS DE BASE ---
    Formula:
      type: string
      minLength: 1
      maxLength: 100
      description: >-
        Expression de la grammaire des dés (docs/technique/notation-des-des.md) qui accepte en plus des
        variables préfixées par @ : @str, @dex, @con, @int, @wis, @cha (modificateurs), @prof, @level,
        @spellMod, @spellAttack, @spellDc, @slotLevel. Les variables ne sont acceptées que dans les données
        de règles, jamais dans un jet libre ; une variable inconnue fait échouer l'import. Format complet :
        docs/technique/format-des-regles.md.
      example: '@spellDc'

    Quantity:
      description: 'Une formule simple, une formule avec un minimum (inspiration bardique : @cha, minimum 1), ou une table par niveau (imposition des mains : 5, 10, 15…).'
      oneOf:
        - $ref: '#/components/schemas/Formula'
        - type: object
          title: FormulaWithMinimum
          required:
            - formula
            - minimum
          properties:
            formula:
              $ref: '#/components/schemas/Formula'
            minimum:
              type: integer
        - type: object
          title: QuantityByLevel
          required:
            - byLevel
          properties:
            byLevel:
              type: array
              items:
                type: object
                required:
                  - level
                  - value
                properties:
                  level:
                    type: integer
                    minimum: 1
                    maximum: 20
                  value:
                    type: integer

    Automation:
      type: string
      enum:
        - full
        - partial
        - manual
      description: 'full : le moteur résout tout ; partial : il résout ce qui est décrit, le MJ complète ; manual : texte seulement.'

    SrdDescription:
      type: array
      description: 'Texte du SRD découpé en paragraphes. Texte brut : jamais interprété comme du HTML ou du Markdown.'
      items:
        type: string
        maxLength: 10000

    Size:
      type: string
      enum:
        - tiny
        - small
        - medium
        - large
        - huge
        - gargantuan

    RestPeriod:
      type: string
      enum:
        - shortRest
        - longRest
        - dawn

    Uses:
      type: object
      description: "Réserve d'utilisations : count, récupérée à chaque per ; regain absent = tout est récupéré."
      required:
        - count
        - per
      properties:
        count:
          $ref: '#/components/schemas/Quantity'
        per:
          $ref: '#/components/schemas/RestPeriod'
        regain:
          $ref: '#/components/schemas/Formula'

    DamageAdjustment:
      type: object
      required:
        - damageType
        - except
      properties:
        damageType:
          $ref: '#/components/schemas/RuleId'
        except:
          type: array
          description: "Attaques non concernées ; vide si rien n'est exclu, jamais null."
          items:
            type: string
            enum:
              - magical
              - silvered
              - adamantine

    # --- DONNÉES SRD : ACTION ---
    Action:
      type: object
      description: >-
        Forme unique des sorts, attaques de monstres et capacités, interprétée par le moteur de règles. Les
        attaques d'armes des personnages ne sont pas stockées comme Action : le moteur les déduit de l'arme.
      required:
        - key
        - name
        - activation
        - cost
        - range
        - targeting
        - resolution
        - duration
        - automation
      properties:
        key:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 64
          description: 'Unique dans son parent.'
        name:
          type: string
          maxLength: 120
        activation:
          $ref: '#/components/schemas/Activation'
        cost:
          type: array
          items:
            $ref: '#/components/schemas/Cost'
        range:
          $ref: '#/components/schemas/Range'
        targeting:
          $ref: '#/components/schemas/Targeting'
        resolution:
          $ref: '#/components/schemas/Resolution'
        duration:
          $ref: '#/components/schemas/Duration'
        scaling:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Scaling'
        automation:
          $ref: '#/components/schemas/Automation'
      example:
        key: cast
        name: Boule de feu
        activation:
          type: action
        cost:
          - resource: spellSlot
            level: 3
        range:
          type: distance
          meters: 45
        targeting:
          type: zone
          shape: sphere
          sizeMeters: 6
          origin: point
        resolution:
          type: save
          ability: dex
          dc: '@spellDc'
          onFailedSave:
            - key: fire
              type: damage
              dice: 8d6
              damageType: fire
          onSuccessfulSave:
            - type: halfDamage
        duration:
          type: instantaneous
          concentration: false
        scaling:
          type: perSlotLevel
          aboveLevel: 3
          effectKey: fire
          addDice: 1d6
        automation: full

    Activation:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - action
            - bonusAction
            - reaction
            - minute
            - hour
            - special
        amount:
          type: integer
          minimum: 1
          description: "Nombre de minutes ou d'heures."
        trigger:
          type: string
          nullable: true
          description: "Déclencheur d'une réaction, en texte."

    Cost:
      oneOf:
        - $ref: '#/components/schemas/SpellSlotCost'
        - $ref: '#/components/schemas/UsesCost'
        - $ref: '#/components/schemas/ChargesCost'
        - $ref: '#/components/schemas/RechargeCost'
        - $ref: '#/components/schemas/LegendaryCost'
      discriminator:
        propertyName: resource
        mapping:
          spellSlot: '#/components/schemas/SpellSlotCost'
          uses: '#/components/schemas/UsesCost'
          charges: '#/components/schemas/ChargesCost'
          recharge: '#/components/schemas/RechargeCost'
          legendary: '#/components/schemas/LegendaryCost'

    SpellSlotCost:
      type: object
      required:
        - resource
        - level
      properties:
        resource:
          type: string
          enum:
            - spellSlot
        level:
          type: integer
          minimum: 1
          maximum: 9

    UsesCost:
      allOf:
        - type: object
          required:
            - resource
          properties:
            resource:
              type: string
              enum:
                - uses
        - $ref: '#/components/schemas/Uses'

    ChargesCost:
      type: object
      description: >-
        Consomme de min à max charges de l'objet magique qui porte l'action (Item.charges). Baguette de
        boules de feu : min 1, max 3, avec un Scaling perExtraCharge pour les charges en plus.
      required:
        - resource
        - min
        - max
      properties:
        resource:
          type: string
          enum:
            - charges
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 1

    RechargeCost:
      type: object
      description: 'Recharge 5–6 : min 5.'
      required:
        - resource
        - min
      properties:
        resource:
          type: string
          enum:
            - recharge
        min:
          type: integer
          minimum: 2
          maximum: 6

    LegendaryCost:
      type: object
      required:
        - resource
        - points
      properties:
        resource:
          type: string
          enum:
            - legendary
        points:
          type: integer
          minimum: 1

    Range:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - self
            - touch
            - distance
            - sight
            - unlimited
        meters:
          type: number
          minimum: 0
          description: 'Portée normale.'
        longMeters:
          type: number
          minimum: 0
          description: 'Longue portée (armes de jet et à distance).'
        reachMeters:
          type: number
          minimum: 0
          description: 'Allonge (attaques au corps à corps).'

    Targeting:
      oneOf:
        - $ref: '#/components/schemas/SelfTargeting'
        - $ref: '#/components/schemas/CreaturesTargeting'
        - $ref: '#/components/schemas/ZoneTargeting'
      discriminator:
        propertyName: type
        mapping:
          self: '#/components/schemas/SelfTargeting'
          creatures: '#/components/schemas/CreaturesTargeting'
          zone: '#/components/schemas/ZoneTargeting'

    SelfTargeting:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - self

    CreaturesTargeting:
      type: object
      required:
        - type
        - count
      properties:
        type:
          type: string
          enum:
            - creatures
        count:
          $ref: '#/components/schemas/Quantity'
        filter:
          type: string
          enum:
            - any
            - ally
            - enemy
          default: any

    ZoneTargeting:
      type: object
      required:
        - type
        - shape
        - sizeMeters
        - origin
      properties:
        type:
          type: string
          enum:
            - zone
        shape:
          type: string
          enum:
            - sphere
            - cone
            - line
            - cube
            - cylinder
        sizeMeters:
          type: number
          minimum: 0
          description: 'Rayon (sphère, cylindre), longueur (cône, ligne) ou côté (cube).'
        widthMeters:
          type: number
          minimum: 0
          description: 'Largeur de la ligne.'
        heightMeters:
          type: number
          minimum: 0
          description: 'Hauteur du cylindre.'
        origin:
          type: string
          enum:
            - self
            - point

    Resolution:
      oneOf:
        - $ref: '#/components/schemas/AttackResolution'
        - $ref: '#/components/schemas/SaveResolution'
        - $ref: '#/components/schemas/AutomaticResolution'
      discriminator:
        propertyName: type
        mapping:
          attack: '#/components/schemas/AttackResolution'
          save: '#/components/schemas/SaveResolution'
          automatic: '#/components/schemas/AutomaticResolution'

    AttackResolution:
      type: object
      required:
        - type
        - kind
        - bonus
        - onHit
        - onMiss
      properties:
        type:
          type: string
          enum:
            - attack
        kind:
          type: string
          enum:
            - melee
            - ranged
            - meleeSpell
            - rangedSpell
        bonus:
          $ref: '#/components/schemas/Formula'
        onHit:
          type: array
          items:
            $ref: '#/components/schemas/Effect'
        onMiss:
          type: array
          items:
            $ref: '#/components/schemas/Effect'

    SaveResolution:
      type: object
      required:
        - type
        - ability
        - dc
        - onFailedSave
        - onSuccessfulSave
      properties:
        type:
          type: string
          enum:
            - save
        ability:
          $ref: '#/components/schemas/AbilityCode'
        dc:
          $ref: '#/components/schemas/Formula'
        onFailedSave:
          type: array
          items:
            $ref: '#/components/schemas/Effect'
        onSuccessfulSave:
          type: array
          items:
            $ref: '#/components/schemas/Effect'

    AutomaticResolution:
      type: object
      required:
        - type
        - effects
      properties:
        type:
          type: string
          enum:
            - automatic
        effects:
          type: array
          items:
            $ref: '#/components/schemas/Effect'

    Duration:
      type: object
      required:
        - type
        - concentration
      properties:
        type:
          type: string
          enum:
            - instantaneous
            - rounds
            - minutes
            - hours
            - days
            - untilDispelled
            - special
        amount:
          type: integer
          minimum: 1
        concentration:
          type: boolean

    Scaling:
      oneOf:
        - $ref: '#/components/schemas/PerSlotLevelScaling'
        - $ref: '#/components/schemas/ByCharacterLevelScaling'
        - $ref: '#/components/schemas/PerExtraChargeScaling'
      discriminator:
        propertyName: type
        mapping:
          perSlotLevel: '#/components/schemas/PerSlotLevelScaling'
          byCharacterLevel: '#/components/schemas/ByCharacterLevelScaling'
          perExtraCharge: '#/components/schemas/PerExtraChargeScaling'

    PerExtraChargeScaling:
      type: object
      description: "Pour chaque charge dépensée au-delà de aboveCharges, l'effet effectKey reçoit addDice en plus."
      required:
        - type
        - aboveCharges
        - effectKey
        - addDice
      properties:
        type:
          type: string
          enum:
            - perExtraCharge
        aboveCharges:
          type: integer
          minimum: 1
        effectKey:
          type: string
          maxLength: 64
        addDice:
          $ref: '#/components/schemas/Formula'

    PerSlotLevelScaling:
      type: object
      required:
        - type
        - aboveLevel
        - effectKey
        - addDice
      properties:
        type:
          type: string
          enum:
            - perSlotLevel
        aboveLevel:
          type: integer
          minimum: 0
          maximum: 9
        effectKey:
          type: string
          maxLength: 64
        addDice:
          $ref: '#/components/schemas/Formula'

    ByCharacterLevelScaling:
      type: object
      description: 'Pour les sorts mineurs : les dés de effectKey changent aux niveaux indiqués.'
      required:
        - type
        - effectKey
        - steps
      properties:
        type:
          type: string
          enum:
            - byCharacterLevel
        effectKey:
          type: string
          maxLength: 64
        steps:
          type: array
          items:
            type: object
            required:
              - level
              - dice
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 20
              dice:
                $ref: '#/components/schemas/Formula'

    # --- DONNÉES SRD : EFFETS PONCTUELS ---
    Effect:
      description: "Effet ponctuel d'une action. Chaque effet peut porter une key, que Scaling.effectKey désigne."
      oneOf:
        - $ref: '#/components/schemas/DamageEffect'
        - $ref: '#/components/schemas/HalfDamageEffect'
        - $ref: '#/components/schemas/HealingEffect'
        - $ref: '#/components/schemas/TemporaryHitPointsEffect'
        - $ref: '#/components/schemas/ConditionEffect'
        - $ref: '#/components/schemas/ModifierEffect'
        - $ref: '#/components/schemas/RollModeEffect'
      discriminator:
        propertyName: type
        mapping:
          damage: '#/components/schemas/DamageEffect'
          halfDamage: '#/components/schemas/HalfDamageEffect'
          healing: '#/components/schemas/HealingEffect'
          temporaryHitPoints: '#/components/schemas/TemporaryHitPointsEffect'
          condition: '#/components/schemas/ConditionEffect'
          modifier: '#/components/schemas/ModifierEffect'
          rollMode: '#/components/schemas/RollModeEffect'

    EffectKey:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64

    DamageEffect:
      type: object
      required:
        - type
        - dice
        - damageType
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - damage
        dice:
          $ref: '#/components/schemas/Formula'
        damageType:
          $ref: '#/components/schemas/RuleId'

    HalfDamageEffect:
      type: object
      description: >-
        Sur une sauvegarde réussie : chacun des effets damage de onFailedSave est divisé par deux, sur les
        mêmes jets, arrondi à l'unité inférieure. Les types de dégâts restent séparés (résistances).
      required:
        - type
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - halfDamage

    HealingEffect:
      type: object
      required:
        - type
        - dice
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - healing
        dice:
          $ref: '#/components/schemas/Formula'

    TemporaryHitPointsEffect:
      type: object
      required:
        - type
        - dice
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - temporaryHitPoints
        dice:
          $ref: '#/components/schemas/Formula'

    ConditionEffect:
      type: object
      required:
        - type
        - condition
        - duration
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - condition
        condition:
          $ref: '#/components/schemas/RuleId'
        duration:
          $ref: '#/components/schemas/Duration'
        repeatSave:
          type: object
          nullable: true
          required:
            - ability
            - dc
            - timing
          properties:
            ability:
              $ref: '#/components/schemas/AbilityCode'
            dc:
              $ref: '#/components/schemas/Formula'
            timing:
              type: string
              enum:
                - startOfTurn
                - endOfTurn

    ModifierEffect:
      type: object
      description: "Bonus ou malus numérique, par exemple 1d4 aux jets d'attaque pour Bénédiction."
      required:
        - type
        - target
        - value
        - duration
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - modifier
        target:
          type: string
          enum:
            - armorClass
            - attackRolls
            - savingThrows
            - abilityChecks
            - speed
            - damage
        value:
          $ref: '#/components/schemas/Formula'
        duration:
          $ref: '#/components/schemas/Duration'

    RollModeEffect:
      type: object
      description: >-
        Avantage ou désavantage, ponctuel (dans Effect, pour la durée de l'action) ou permanent (dans
        PassiveEffect). ability limite l'effet à une caractéristique (Entravé : sauvegardes de DEX) ;
        withinMeters et beyondMeters gèrent les cas liés à la distance (À terre : deux rollMode).
      required:
        - type
        - target
        - mode
        - appliesTo
      properties:
        key:
          $ref: '#/components/schemas/EffectKey'
        type:
          type: string
          enum:
            - rollMode
        target:
          type: string
          enum:
            - attackRolls
            - abilityChecks
            - savingThrows
        mode:
          type: string
          enum:
            - advantage
            - disadvantage
        appliesTo:
          type: string
          enum:
            - self
            - attackersAgainst
        ability:
          $ref: '#/components/schemas/AbilityCode'
        withinMeters:
          type: number
          minimum: 0
        beyondMeters:
          type: number
          minimum: 0

    # --- DONNÉES SRD : EFFETS PASSIFS ---
    PassiveEffect:
      description: "Effet permanent d'une capacité, d'un état ou d'un objet magique."
      oneOf:
        - $ref: '#/components/schemas/ProficiencyEffect'
        - $ref: '#/components/schemas/DamageAdjustmentEffect'
        - $ref: '#/components/schemas/ConditionImmunityEffect'
        - $ref: '#/components/schemas/SenseEffect'
        - $ref: '#/components/schemas/ArmorClassFormulaEffect'
        - $ref: '#/components/schemas/SpeedEffect'
        - $ref: '#/components/schemas/HitPointMaximumEffect'
        - $ref: '#/components/schemas/AbilityScoreEffect'
        - $ref: '#/components/schemas/RollModeEffect'
        - $ref: '#/components/schemas/AutoFailEffect'
        - $ref: '#/components/schemas/AutoCriticalEffect'
        - $ref: '#/components/schemas/CannotActEffect'
      discriminator:
        propertyName: type
        mapping:
          proficiency: '#/components/schemas/ProficiencyEffect'
          damageAdjustment: '#/components/schemas/DamageAdjustmentEffect'
          conditionImmunity: '#/components/schemas/ConditionImmunityEffect'
          sense: '#/components/schemas/SenseEffect'
          armorClassFormula: '#/components/schemas/ArmorClassFormulaEffect'
          speed: '#/components/schemas/SpeedEffect'
          hitPointMaximum: '#/components/schemas/HitPointMaximumEffect'
          abilityScore: '#/components/schemas/AbilityScoreEffect'
          rollMode: '#/components/schemas/RollModeEffect'
          autoFail: '#/components/schemas/AutoFailEffect'
          autoCritical: '#/components/schemas/AutoCriticalEffect'
          cannotAct: '#/components/schemas/CannotActEffect'

    ProficiencyEffect:
      type: object
      required:
        - type
        - kind
        - ref
      properties:
        type:
          type: string
          enum:
            - proficiency
        kind:
          type: string
          enum:
            - skill
            - savingThrow
            - armor
            - weapon
            - tool
            - language
        ref:
          $ref: '#/components/schemas/RuleId'
        expertise:
          type: boolean
          default: false

    DamageAdjustmentEffect:
      allOf:
        - type: object
          required:
            - type
            - mode
          properties:
            type:
              type: string
              enum:
                - damageAdjustment
            mode:
              type: string
              enum:
                - resistance
                - vulnerability
                - immunity
        - $ref: '#/components/schemas/DamageAdjustment'

    ConditionImmunityEffect:
      type: object
      required:
        - type
        - condition
      properties:
        type:
          type: string
          enum:
            - conditionImmunity
        condition:
          $ref: '#/components/schemas/RuleId'

    SenseEffect:
      type: object
      required:
        - type
        - sense
        - meters
      properties:
        type:
          type: string
          enum:
            - sense
        sense:
          type: string
          enum:
            - darkvision
            - blindsight
            - truesight
            - tremorsense
        meters:
          type: number
          minimum: 0
          example: 18

    ArmorClassFormulaEffect:
      type: object
      description: 'Défense sans armure : 10 + @dex + @con, bouclier permis (barbare) ou non (moine).'
      required:
        - type
        - formula
        - allowsShield
      properties:
        type:
          type: string
          enum:
            - armorClassFormula
        formula:
          $ref: '#/components/schemas/Formula'
        allowsShield:
          type: boolean

    SpeedEffect:
      type: object
      description: 'bonusMeters ou setMeters, jamais les deux ; setMeters 0 pour Agrippé.'
      required:
        - type
        - movement
      properties:
        type:
          type: string
          enum:
            - speed
        movement:
          type: string
          enum:
            - walk
            - fly
            - swim
            - climb
            - burrow
        bonusMeters:
          type: number
        setMeters:
          type: number
          minimum: 0

    HitPointMaximumEffect:
      type: object
      description: 'Par exemple la robustesse naine : +1 PV maximum par niveau.'
      required:
        - type
        - perLevel
      properties:
        type:
          type: string
          enum:
            - hitPointMaximum
        perLevel:
          type: integer

    AbilityScoreEffect:
      type: object
      description: 'set (valeur fixe) ou bonus, jamais les deux ; max plafonne le résultat.'
      required:
        - type
        - ability
      properties:
        type:
          type: string
          enum:
            - abilityScore
        ability:
          $ref: '#/components/schemas/AbilityCode'
        set:
          type: integer
          minimum: 1
          maximum: 30
        bonus:
          type: integer
        max:
          type: integer
          minimum: 1
          maximum: 30

    AutoFailEffect:
      type: object
      description: 'Rate automatiquement certaines sauvegardes (Paralysé : FOR et DEX).'
      required:
        - type
        - savingThrows
      properties:
        type:
          type: string
          enum:
            - autoFail
        savingThrows:
          type: array
          items:
            $ref: '#/components/schemas/AbilityCode'

    AutoCriticalEffect:
      type: object
      description: 'Les coups portés à withinMeters ou moins sont critiques (Paralysé : 1,5 m).'
      required:
        - type
        - withinMeters
      properties:
        type:
          type: string
          enum:
            - autoCritical
        withinMeters:
          type: number
          minimum: 0

    CannotActEffect:
      type: object
      description: 'Neutralisé : ni actions ni réactions.'
      required:
        - type
        - actions
        - reactions
        - movement
      properties:
        type:
          type: string
          enum:
            - cannotAct
        actions:
          type: boolean
        reactions:
          type: boolean
        movement:
          type: boolean

    # --- DONNÉES SRD : ENTITÉS ---
    Feature:
      type: object
      required:
        - id
        - name
        - description
        - actions
        - passive
        - automation
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        description:
          $ref: '#/components/schemas/SrdDescription'
        level:
          type: integer
          minimum: 1
          maximum: 20
          description: 'Niveau auquel une capacité de classe est obtenue.'
        uses:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Uses'
        actions:
          type: array
          description: 'Vide si la capacité est passive.'
          items:
            $ref: '#/components/schemas/Action'
        passive:
          type: array
          items:
            $ref: '#/components/schemas/PassiveEffect'
        automation:
          $ref: '#/components/schemas/Automation'

    Species:
      type: object
      description: "Espèce aplatie : high-elf contient déjà les traits communs des elfes ; family ne sert qu'au regroupement à l'écran."
      required:
        - id
        - name
        - family
        - size
        - speedMeters
        - abilityBonuses
        - traits
        - languages
        - choiceGroups
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        family:
          $ref: '#/components/schemas/RuleId'
        size:
          $ref: '#/components/schemas/Size'
        speedMeters:
          type: number
          minimum: 0
          example: 9
        abilityBonuses:
          type: array
          items:
            type: object
            required:
              - ability
              - value
            properties:
              ability:
                $ref: '#/components/schemas/AbilityCode'
              value:
                type: integer
        traits:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'
        choiceGroups:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceGroup'

    ClassSpellcasting:
      type: object
      description: >-
        standard : emplacements par niveau de personnage (slotsByLevel). pact (occultiste) : emplacements
        tous du même niveau, récupérés au repos court (pactSlotsByLevel).
      required:
        - ability
        - preparation
        - slotProgression
        - cantripsKnownByLevel
      properties:
        ability:
          $ref: '#/components/schemas/AbilityCode'
        preparation:
          type: string
          enum:
            - prepared
            - known
        slotProgression:
          type: string
          enum:
            - standard
            - pact
        slotsByLevel:
          type: array
          description: 'Progression standard seulement.'
          items:
            type: object
            required:
              - level
              - slots
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 20
              slots:
                type: array
                items:
                  type: object
                  required:
                    - slotLevel
                    - count
                  properties:
                    slotLevel:
                      type: integer
                      minimum: 1
                      maximum: 9
                    count:
                      type: integer
                      minimum: 0
        pactSlotsByLevel:
          type: array
          description: 'Magie de pacte seulement.'
          items:
            type: object
            required:
              - level
              - count
              - slotLevel
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 20
              count:
                type: integer
                minimum: 0
              slotLevel:
                type: integer
                minimum: 1
                maximum: 5
        cantripsKnownByLevel:
          $ref: '#/components/schemas/CountByLevel'
        spellsKnownByLevel:
          description: 'Préparation known seulement.'
          allOf:
            - $ref: '#/components/schemas/CountByLevel'

    CountByLevel:
      type: array
      items:
        type: object
        required:
          - level
          - count
        properties:
          level:
            type: integer
            minimum: 1
            maximum: 20
          count:
            type: integer
            minimum: 0

    ClassLevel:
      type: object
      required:
        - level
        - proficiencyBonus
        - features
        - subclassFeature
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 20
        proficiencyBonus:
          type: integer
          minimum: 2
          maximum: 6
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        subclassFeature:
          type: boolean
          description: 'Ce niveau donne une capacité de sous-classe.'

    Subclass:
      type: object
      required:
        - id
        - name
        - class
        - levels
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        class:
          $ref: '#/components/schemas/RuleRef'
        levels:
          type: array
          items:
            type: object
            required:
              - level
              - features
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 20
              features:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'

    Class:
      type: object
      description: "Les 20 niveaux du SRD sont importés ; l'API n'expose que les niveaux jusqu'au réglage maxLevel du serveur (5 au MVP)."
      required:
        - id
        - name
        - hitDie
        - primaryAbilities
        - savingThrows
        - proficiencies
        - choiceGroups
        - spellcasting
        - levels
        - subclasses
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        hitDie:
          type: string
          pattern: '^d(6|8|10|12)$'
          example: 'd10'
        primaryAbilities:
          type: array
          items:
            $ref: '#/components/schemas/AbilityCode'
        savingThrows:
          type: array
          items:
            $ref: '#/components/schemas/AbilityCode'
        proficiencies:
          type: object
          required:
            - armor
            - weapons
            - tools
          properties:
            armor:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
            weapons:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
            tools:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
        choiceGroups:
          type: array
          description: 'Compétences et équipement de départ.'
          items:
            $ref: '#/components/schemas/ChoiceGroup'
        spellcasting:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassSpellcasting'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/ClassLevel'
        subclasses:
          type: array
          items:
            $ref: '#/components/schemas/Subclass'

    Background:
      type: object
      required:
        - id
        - name
        - proficiencies
        - choiceGroups
        - equipment
        - feature
        - description
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        proficiencies:
          type: array
          items:
            $ref: '#/components/schemas/ProficiencyEffect'
        choiceGroups:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceGroup'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/ItemQuantity'
        feature:
          $ref: '#/components/schemas/Feature'
        description:
          $ref: '#/components/schemas/SrdDescription'

    ItemQuantity:
      type: object
      required:
        - item
        - quantity
      properties:
        item:
          $ref: '#/components/schemas/RuleRef'
        quantity:
          type: integer
          minimum: 1

    Spell:
      type: object
      required:
        - id
        - name
        - level
        - school
        - components
        - ritual
        - classes
        - actions
        - automation
        - description
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        level:
          type: integer
          minimum: 0
          maximum: 9
          description: '0 pour un sort mineur.'
        school:
          $ref: '#/components/schemas/RuleId'
        components:
          type: object
          required:
            - verbal
            - somatic
            - material
          properties:
            verbal:
              type: boolean
            somatic:
              type: boolean
            material:
              type: object
              nullable: true
              required:
                - text
                - costCp
                - consumed
              properties:
                text:
                  type: string
                  maxLength: 500
                costCp:
                  type: integer
                  nullable: true
                  minimum: 0
                consumed:
                  type: boolean
        ritual:
          type: boolean
        classes:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        automation:
          $ref: '#/components/schemas/Automation'
        description:
          $ref: '#/components/schemas/SrdDescription'

    ItemCategory:
      type: string
      enum:
        - weapon
        - armor
        - gear
        - tool
        - pack
        - magicItem

    Rarity:
      type: string
      enum:
        - common
        - uncommon
        - rare
        - veryRare
        - legendary
        - artifact

    ItemBase:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        costCp:
          type: integer
          nullable: true
          minimum: 0
          description: 'Prix en pièces de cuivre.'
        weightKg:
          type: number
          nullable: true
          minimum: 0
        description:
          $ref: '#/components/schemas/SrdDescription'

    WeaponItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required:
            - category
            - weaponCategory
            - attackKind
            - damage
            - properties
          properties:
            category:
              type: string
              enum:
                - weapon
            weaponCategory:
              type: string
              enum:
                - simple
                - martial
            attackKind:
              type: string
              enum:
                - melee
                - ranged
            damage:
              type: object
              required:
                - dice
                - damageType
              properties:
                dice:
                  $ref: '#/components/schemas/Formula'
                damageType:
                  $ref: '#/components/schemas/RuleId'
            versatileDice:
              nullable: true
              type: string
              allOf:
                - $ref: '#/components/schemas/Formula'
            properties:
              type: array
              description: "Vocabulaire du moteur : ammunition, finesse, heavy, light, loading, reach, special, thrown, two-handed, versatile. special (lance d'arçon, filet) n'est pas interprétable : l'arme passe en automation partial."
              items:
                $ref: '#/components/schemas/RuleId'
            rangeMeters:
              type: object
              nullable: true
              required:
                - normal
                - long
              properties:
                normal:
                  type: number
                  minimum: 0
                long:
                  type: number
                  minimum: 0

    ArmorItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required:
            - category
            - armorCategory
            - baseArmorClass
            - dexterityCap
            - stealthDisadvantage
          properties:
            category:
              type: string
              enum:
                - armor
            armorCategory:
              type: string
              enum:
                - light
                - medium
                - heavy
                - shield
            baseArmorClass:
              type: integer
              minimum: 0
            dexterityCap:
              type: integer
              nullable: true
              minimum: 0
              description: 'null : sans limite (légère) ; 2 : intermédiaire ; 0 : lourde.'
            strengthRequirement:
              type: integer
              nullable: true
              minimum: 1
            stealthDisadvantage:
              type: boolean

    GearItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required:
            - category
          properties:
            category:
              type: string
              enum:
                - gear

    ToolItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required:
            - category
          properties:
            category:
              type: string
              enum:
                - tool

    PackItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required:
            - category
            - contents
          properties:
            category:
              type: string
              enum:
                - pack
            contents:
              type: array
              items:
                $ref: '#/components/schemas/ItemQuantity'

    MagicItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required:
            - category
            - rarity
            - requiresAttunement
            - baseItem
            - charges
            - passive
            - actions
            - automation
          properties:
            category:
              type: string
              enum:
                - magicItem
            rarity:
              $ref: '#/components/schemas/Rarity'
            requiresAttunement:
              type: boolean
            baseItem:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RuleRef'
            charges:
              type: object
              nullable: true
              description: "Charges de l'objet, consommées par ChargesCost."
              required:
                - max
                - per
              properties:
                max:
                  $ref: '#/components/schemas/Quantity'
                per:
                  $ref: '#/components/schemas/RestPeriod'
                regain:
                  $ref: '#/components/schemas/Formula'
            passive:
              type: array
              items:
                $ref: '#/components/schemas/PassiveEffect'
            actions:
              type: array
              items:
                $ref: '#/components/schemas/Action'
            automation:
              $ref: '#/components/schemas/Automation'

    Item:
      oneOf:
        - $ref: '#/components/schemas/WeaponItem'
        - $ref: '#/components/schemas/ArmorItem'
        - $ref: '#/components/schemas/GearItem'
        - $ref: '#/components/schemas/ToolItem'
        - $ref: '#/components/schemas/PackItem'
        - $ref: '#/components/schemas/MagicItem'
      discriminator:
        propertyName: category
        mapping:
          weapon: '#/components/schemas/WeaponItem'
          armor: '#/components/schemas/ArmorItem'
          gear: '#/components/schemas/GearItem'
          tool: '#/components/schemas/ToolItem'
          pack: '#/components/schemas/PackItem'
          magicItem: '#/components/schemas/MagicItem'

    Condition:
      type: object
      required:
        - id
        - name
        - description
        - passive
        - automation
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        description:
          $ref: '#/components/schemas/SrdDescription'
        passive:
          type: array
          description: 'Effets mécaniques : désavantage aux attaques pour Empoisonné, etc.'
          items:
            $ref: '#/components/schemas/PassiveEffect'
        automation:
          $ref: '#/components/schemas/Automation'

    MonsterSummary:
      type: object
      required:
        - id
        - name
        - size
        - type
        - challengeRating
        - xp
        - armorClass
        - hitPointsAverage
      properties:
        id:
          $ref: '#/components/schemas/RuleId'
        name:
          type: string
          maxLength: 120
        size:
          $ref: '#/components/schemas/Size'
        type:
          $ref: '#/components/schemas/RuleId'
        challengeRating:
          type: number
          minimum: 0
          maximum: 30
          description: '0.25 pour 1/4.'
          example: 2
        xp:
          type: integer
          minimum: 0
          example: 450
        armorClass:
          type: integer
          minimum: 0
          example: 11
        hitPointsAverage:
          type: integer
          minimum: 1
          example: 59

    MonsterSpellcasting:
      type: object
      description: 'Valeurs fixes du monstre, qui remplacent @spellDc et @spellAttack dans les actions de ses sorts (entités Spell).'
      required:
        - ability
        - dc
        - attackBonus
        - slots
        - perDay
        - atWill
      properties:
        ability:
          $ref: '#/components/schemas/AbilityCode'
        dc:
          type: integer
        attackBonus:
          type: integer
        slots:
          type: array
          nullable: true
          items:
            type: object
            required:
              - level
              - count
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 9
              count:
                type: integer
                minimum: 0
        perDay:
          type: array
          items:
            type: object
            required:
              - count
              - spells
            properties:
              count:
                type: integer
                minimum: 1
              spells:
                type: array
                items:
                  $ref: '#/components/schemas/RuleRef'
        atWill:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'

    Monster:
      description: 'Bloc de statistiques complet. Les bonus sont déjà calculés : les actions utilisent des valeurs fixes.'
      allOf:
        - $ref: '#/components/schemas/MonsterSummary'
        - type: object
          required:
            - alignment
            - hitDice
            - speeds
            - abilities
            - savingThrows
            - skills
            - damageVulnerabilities
            - damageResistances
            - damageImmunities
            - conditionImmunities
            - senses
            - languages
            - proficiencyBonus
            - traits
            - actions
            - reactions
            - automation
            - description
          properties:
            subtype:
              type: string
              nullable: true
              maxLength: 60
            alignment:
              type: string
              maxLength: 60
            armorClassSource:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RuleRef'
            hitDice:
              $ref: '#/components/schemas/Formula'
            speeds:
              type: object
              description: 'En mètres.'
              required:
                - walk
              properties:
                walk:
                  type: number
                  minimum: 0
                fly:
                  type: number
                  minimum: 0
                swim:
                  type: number
                  minimum: 0
                climb:
                  type: number
                  minimum: 0
                burrow:
                  type: number
                  minimum: 0
                hover:
                  type: boolean
            abilities:
              type: object
              required:
                - str
                - dex
                - con
                - int
                - wis
                - cha
              properties:
                str:
                  type: integer
                  minimum: 1
                  maximum: 30
                dex:
                  type: integer
                  minimum: 1
                  maximum: 30
                con:
                  type: integer
                  minimum: 1
                  maximum: 30
                int:
                  type: integer
                  minimum: 1
                  maximum: 30
                wis:
                  type: integer
                  minimum: 1
                  maximum: 30
                cha:
                  type: integer
                  minimum: 1
                  maximum: 30
            savingThrows:
              type: array
              items:
                type: object
                required:
                  - ability
                  - bonus
                properties:
                  ability:
                    $ref: '#/components/schemas/AbilityCode'
                  bonus:
                    type: integer
            skills:
              type: array
              items:
                type: object
                required:
                  - skill
                  - bonus
                properties:
                  skill:
                    $ref: '#/components/schemas/RuleRef'
                  bonus:
                    type: integer
            damageVulnerabilities:
              type: array
              items:
                $ref: '#/components/schemas/DamageAdjustment'
            damageResistances:
              type: array
              items:
                $ref: '#/components/schemas/DamageAdjustment'
            damageImmunities:
              type: array
              items:
                $ref: '#/components/schemas/DamageAdjustment'
            conditionImmunities:
              type: array
              items:
                $ref: '#/components/schemas/RuleId'
            senses:
              type: object
              description: 'En mètres.'
              required:
                - passivePerception
              properties:
                darkvision:
                  type: number
                  minimum: 0
                blindsight:
                  type: number
                  minimum: 0
                truesight:
                  type: number
                  minimum: 0
                tremorsense:
                  type: number
                  minimum: 0
                passivePerception:
                  type: integer
            languages:
              type: array
              items:
                $ref: '#/components/schemas/RuleRef'
            proficiencyBonus:
              type: integer
              minimum: 2
              maximum: 9
            traits:
              type: array
              items:
                $ref: '#/components/schemas/Feature'
            actions:
              type: array
              items:
                $ref: '#/components/schemas/Action'
            multiattack:
              type: object
              nullable: true
              required:
                - attacks
              properties:
                attacks:
                  type: array
                  items:
                    type: object
                    required:
                      - actionKey
                      - count
                    properties:
                      actionKey:
                        type: string
                        maxLength: 64
                      count:
                        type: integer
                        minimum: 1
            reactions:
              type: array
              items:
                $ref: '#/components/schemas/Action'
            legendary:
              type: object
              nullable: true
              description: 'Le coût de chaque action est porté par Cost.legendary.'
              required:
                - perRound
                - actions
              properties:
                perRound:
                  type: integer
                  minimum: 1
                actions:
                  type: array
                  items:
                    $ref: '#/components/schemas/Action'
            spellcasting:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/MonsterSpellcasting'
            automation:
              $ref: '#/components/schemas/Automation'
            description:
              $ref: '#/components/schemas/SrdDescription'

    # --- DONNÉES SRD : LISTES ET ATTRIBUTION ---
    RuleRefPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'
        nextCursor:
