name: Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      description: Navigateur, appareil, version de l'app, branche
  - type: textarea
    id: logs
    attributes:
      label: Logs ou captures
      render: shell
